  --accent-soft: #e8f0fb;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --surface: #1f1f1e; --ink: #ecebe8; --muted: #a09f9a; --faint: #6b6a66;
    --line: #2e2e2c; --accent: #5b9be6; --accent-soft: #1d2a3b; --warn: #d9904a; --frozen: #4a4a47;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --surface: #1f1f1e; --ink: #ecebe8; --muted: #a09f9a; --faint: #6b6a66;
  --line: #2e2e2c; --accent: #5b9be6; --accent-soft: #1d2a3b; --warn: #d9904a; --frozen: #4a4a47;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
figure { margin: 40px auto; max-width: 760px; padding: 0 16px; }

.stage {
  height: 460px; display: flex; flex-direction: column; gap: 14px;
  padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
}

/* Cards */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
  padding: 9px 12px; font-size: 13px; line-height: 1.45;
  transition: filter 1.2s ease, opacity 1.2s ease, border-color 1.2s ease;
}
.task { border-left: 3px solid var(--ink); flex: none; }
.task .who { font: 11px var(--mono); color: var(--muted); margin-bottom: 2px; }
.task .title { font-weight: 600; min-height: 1.45em; }
.task pre {
  margin: 0; font: 11.5px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap;
}
.collapse { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .5s ease, opacity .5s ease; }
.collapse > * { overflow: hidden; min-height: 0; }
.collapse.shut { grid-template-rows: 0fr; opacity: 0; }

/* The turns, newest at the bottom; older ones scroll up and fade out */
.feed {
  flex: 1; position: relative; overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 38%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 38%);
}
.feed-inner { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
.slot { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .3s ease, opacity .3s ease; }
.slot.open { grid-template-rows: 1fr; opacity: 1; }
.slot > div { overflow: hidden; min-height: 0; }
.slot .card { margin-top: 7px; display: flex; gap: 11px; }
.tn { font: 11px/1.9 var(--mono); color: var(--faint); width: 20px; text-align: right; flex: none; }
.body { min-width: 0; flex: 1; }
.thought { color: var(--muted); min-height: 1.45em; }
.call { font: 12px/1.5 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.5em; }
.tool {
  display: inline-block; font: 10.5px/1.6 var(--mono); padding: 0 5px; margin-right: 6px;
  border-radius: 3px; background: var(--accent-soft); color: var(--accent);
}
.tool.submit { background: var(--accent); color: var(--surface); }
.tool.bad { background: transparent; color: var(--warn); padding: 0; }
.out {
  font: 11.5px/1.5 var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; opacity: 0; transition: opacity .25s ease;
}
.out.show { opacity: 1; }
.out::before { content: "→ "; }
.out:empty { display: none; }

/* The whole trajectory, one sliver per turn */
.deck { flex: none; height: 38px; position: relative; }
.track { position: absolute; left: 0; right: 0; top: 4px; height: 18px; }
.sliver {
  position: absolute; top: 0; height: 100%; border-radius: 1.5px; background: var(--accent);
  transform: scaleY(0); transform-origin: bottom; transition: transform .2s ease, background-color 1.2s ease;
}
.sliver.in { transform: scaleY(1); }
.sliver.submit { top: -5px; height: calc(100% + 5px); }
.tick { position: absolute; top: 0; height: 26px; border-left: 1px dashed var(--faint); }
.label { position: absolute; top: 25px; font: 10.5px var(--mono); color: var(--faint); transform: translateX(-50%); white-space: nowrap; }
.counter { position: absolute; top: 25px; right: 0; font: 10.5px var(--mono); color: var(--muted); white-space: nowrap; transition: color 1.2s ease; }

/* Once the rollout ends, it's fixed data */
.frozen .card { filter: grayscale(1); opacity: .6; }
.frozen .sliver { background: var(--frozen); }
.frozen .counter { color: var(--faint); }
.stage > * { transition: opacity .8s ease; }
.fading > * { opacity: 0; }

@media (max-width: 520px) {
  .stage { height: 420px; padding: 12px; }
  .card { font-size: 12px; }
  .call { font-size: 11px; }
}
</style>

  for (let i = 1; i <= text.length; i += 2) {
    node.textContent = text.slice(0, i);
    await sleep(2000 / cps);
  }
  node.textContent = text;
}

function buildTrack() {
  const track = $("track");
  track.replaceChildren();
  const tick = el("div", "tick"); tick.style.left = pct(LIMIT + 1); track.append(tick);
  for (const [t, text] of [[1, "1"], [LIMIT + 1, String(LIMIT)]]) {
    const l = el("div", "label", text); l.style.left = pct(t); track.append(l);
  }
  const counter = el("div", "counter"); counter.id = "counter"; track.append(counter);
}

function addSliver(t, last) {
  const s = el("div", "sliver" + (last ? " submit" : ""));
  s.style.left = pct(t);
  s.style.width = `calc(${100 / SCALE}% - 2px)`;
  $("track").append(s);
  requestAnimationFrame(() => s.classList.add("in"));
  const c = $("counter");
  c.textContent = last ? `turn ${t} · submitted` : `turn ${t}`;
}

function makeCard(t) {
  const [thought, tool, cmd, out] = turns[t - 1];
  const slot = el("div", "slot"), inner = el("div"), card = el("div", "card");
  const body = el("div", "body");
  const th = el("div", "thought"), call = el("div", "call"), o = el("div", "out");
  const chip = tool === "none" ? el("span", "tool bad", "⚠ no valid tool call")
             : el("span", "tool" + (tool === "task_complete" ? " submit" : ""), tool);
  const code = el("span");
  call.append(chip, code);
  body.append(th, call, o);
  card.append(el("div", "tn", String(t)), body);
  inner.append(card); slot.append(inner);
  $("feed").append(slot);
  while ($("feed").children.length > MAX_CARDS) $("feed").firstChild.remove();
  requestAnimationFrame(() => requestAnimationFrame(() => slot.classList.add("open")));
  return { th, code, o, thought, cmd, out };
}

async function turn(t, typed) {
  const c = makeCard(t);
  if (typed) {
    await sleep(250);
    await typeInto(c.th, c.thought, 130);
    await sleep(120);
    await typeInto(c.code, c.cmd, 170);
    await sleep(200);
  } else {
    c.th.textContent = c.thought; c.code.textContent = c.cmd;
  }
  c.o.textContent = c.out;
  c.o.classList.add("show");
  addSliver(t, t === turns.length);
}

// Time between untyped turns: slows down early, speeds through the middle, lands on the last one
function gap(t) {
  const n = turns.length;
  if (t >= n - 3) return 380;
  if (t <= 14) return 650 - (t - 4) * 52;
  return 85;
}

function reset() {
  const stage = $("stage");
  stage.classList.remove("frozen", "fading");
  $("feed").replaceChildren();
  $("title").textContent = "";
  $("code").textContent = "";
  $("problem").classList.remove("shut");
  buildTrack();
}

async function play() {
  reset();
  await sleep(500);
  await typeInto($("title"), titleLine, 60);
  for (const line of codeLines) { $("code").textContent += ($("code").textContent ? "\n" : "") + line; await sleep(140); }
  await sleep(900);
  $("problem").classList.add("shut");
  await sleep(300);
  for (let t = 1; t <= 3; t++) { await turn(t, true); await sleep(450); }
  for (let t = 4; t <= turns.length; t++) { await turn(t, false); await sleep(gap(t)); }
  await sleep(1200);
  $("stage").classList.add("frozen");
  await sleep(3200);
  $("stage").classList.add("fading");
  await sleep(1000);
}

function still() {  // reduced motion: the end state, no animation
  reset();
  $("title").textContent = titleLine;
  $("problem").classList.add("shut");
  for (let t = turns.length - MAX_CARDS + 1; t <= turns.length; t++) {
    const c = makeCard(t); c.th.textContent = c.thought; c.code.textContent = c.cmd;
    c.o.textContent = c.out; c.o.classList.add("show");
  }
  for (let t = 1; t <= turns.length; t++) addSliver(t, t === turns.length);
  $("stage").classList.add("frozen");
}

if (reduced) still();
else (async () => { for (;;) await play(); })();
</script>
</body>
