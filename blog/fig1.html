<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-distillation figure</title>
<style>
:root {
  --bg: #fcfcfb;
  --ink: #1a1a19;
  --muted: #6b6a66;
  --faint: #a3a29d;
  --line: #e6e5e1;
  /* The cards are terminal panes, dark in both page themes */
  --term: #161615;
  --term-edge: #3a3a36;
  --term-top: #6a6964;  /* the top edge, what shows of each card behind the front one */
  --term-ink: #e8e6e1;
  --term-dim: #8e8d87;
  --term-faint: #63625d;
  --ok: #6cc287;
  --warn: #e0a458;
  /* The two contexts the same model reads */
  --nohint: #5b9be6;
  --hint: #e8a33d;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1f1e; --ink: #ecebe8; --muted: #a09f9a; --faint: #6b6a66; --line: #34342f;
    --term: #121211; --term-edge: #3f3f3b;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1f1e; --ink: #ecebe8; --muted: #a09f9a; --faint: #6b6a66; --line: #34342f;
  --term: #121211; --term-edge: #3f3f3b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono); }
figure { margin: 40px auto; max-width: 760px; padding: 0 16px; }

.stage { --h: 108px; --step: 4px; height: 410px; max-width: 600px; margin: 0 auto; position: relative; }
.layer { position: absolute; inset: 0; transition: opacity .5s ease; }
.layer.hidden { opacity: 0; pointer-events: none; }

/* Every card has the same height, so the cards behind the front one show as evenly spaced edges */
.card {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--h);
  background: var(--term); border: 1px solid var(--term-edge); border-top-color: var(--term-top); border-radius: 7px;
  padding: 10px 14px; font: 12px/1.55 var(--mono); color: var(--term-ink); overflow: hidden;
  box-shadow: 0 -1px 0 rgb(0 0 0 / .55);  /* a dark line above each card sets its light top edge apart */
  transform-origin: 50% 100%;
  transition: transform .28s ease, box-shadow .28s ease, filter .28s ease, background-color 1s ease, border-color 1s ease, color 1s ease, opacity .25s ease;
}
.card * { transition: color 1s ease; }
.slow .card { transition-duration: .7s; }
.card.front { box-shadow: 0 -1px 0 rgb(0 0 0 / .55), 0 8px 22px -12px rgb(0 0 0 / .5); }
/* Once the rollout ends, it's stored data: the cards go gray */
.card.frozen {
  --term: #6b6b67; --term-edge: #7d7d78; --term-top: #9a9994; --term-ink: #f1f1ee;
  --term-dim: #d2d2ce; --term-faint: #b9b9b4; --ok: #e2e2de; --warn: #e2e2de;
}
.card.hint { border-top: 2px solid var(--hint); }
.card.hint .mark { color: var(--hint); }
.head { position: absolute; top: 9px; right: 12px; font-size: 10.5px; color: var(--term-faint); }
.line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.55em; padding-right: 56px; }
.wrap { min-height: 1.55em; padding-right: 56px; }
.mark { display: inline-block; width: 2ch; }
.ask .mark { color: var(--term-dim); }
.issue { padding-left: 2ch; color: var(--term-dim); opacity: 0; transition: opacity .35s ease; }
.issue.show { opacity: 1; }
.issue .title { color: var(--term-ink); }
.issue div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thought {
  color: var(--term-dim); font-style: italic; min-height: 1.55em; padding-right: 56px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.thought .mark { font-style: normal; }
.call .mark { color: var(--ok); }
.call.bad .mark, .call.bad .name { color: var(--warn); }
.name { font-weight: 600; }
.out { color: var(--term-dim); padding-left: 2ch; }
.out .mark { color: var(--term-faint); }

/* Step 3: the same model reads the same stored turn in two contexts */
.learn { display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.contexts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.ctx { display: flex; flex-direction: column; gap: 6px; }
.mini { position: relative; height: 100px; }
.mini .edge {
  position: absolute; left: 0; right: 0; height: 40px; border-radius: 4px;
  background: #6b6b67; border-top: 1px solid #9a9994; box-shadow: 0 -1px 0 rgb(0 0 0 / .4);
}
.mini .face {
  position: absolute; left: 0; right: 0; bottom: 0; height: 34px; border-radius: 5px; padding: 6px 9px;
  background: #6b6b67; border-top: 1px solid #9a9994; color: #f1f1ee; font-size: 10.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 -1px 0 rgb(0 0 0 / .4);
}
.mini .face.hint { background: var(--term); border-top: 2px solid var(--hint); color: var(--term-ink); }
.mini .face.hint b { color: var(--hint); font-weight: normal; }
.who { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }

.tokcard {
  background: var(--term); border: 1px solid var(--term-edge); border-radius: 7px; padding: 10px 14px;
  font: 14px/1.9 var(--mono); color: var(--term-ink);
}
.tokcard .row { white-space: nowrap; overflow: hidden; }
.tokcard .thought-row { color: var(--term-dim); font-style: italic; }
.tok { border-radius: 3px; padding: 1px 0; transition: background-color .3s ease, box-shadow .2s ease, color .3s ease; }
.tok.cur { box-shadow: 0 0 0 1.5px var(--term-ink); }
.tok.scored { color: var(--term-ink); }

.dist { display: grid; grid-template-columns: 9ch 1fr; row-gap: 9px; column-gap: 12px; align-items: center; font-size: 12.5px; min-height: 128px; align-content: start; }
.dist .cand { text-align: right; color: var(--muted); white-space: pre; }
.dist .cand.sampled { color: var(--ink); font-weight: 600; }
.bars { display: flex; flex-direction: column; gap: 2px; }
.bar { height: 9px; border-radius: 2px; width: 0; transition: width .35s ease; }
.bar.a { background: var(--nohint); }
.bar.b { background: var(--hint); }
.score { display: flex; align-items: baseline; gap: 10px; font-size: 12px; color: var(--muted); min-height: 1.4em; }
.score b { font-size: 15px; color: var(--ink); font-weight: 600; transition: color .3s ease; }

@media (max-width: 520px) {
  .stage { --h: 124px; --step: 3px; height: 390px; }
  .card { font-size: 11px; padding: 9px 11px; }
  .tokcard { font-size: 11px; }
  .mini { height: 80px; }
}
</style>
</head>

   "cd /testbed/tests && python runtests.py i18n.tests -v 2 2>&1 | tail -\u2026",
   "The active locale's formats take precedence over the default\u2026"
  ],
  [
   "All 93 i18n tests pass. The fix is working correctly and doesn't break any existing functionality.",
   "bash",
   "cd /testbed && python3 -c \"",
   "Testing the exact issue from the PR description:"
  ],
  [
   "The fix works correctly. Let me summarize what I did:",
   "bash",
   "ls -la /testbed/*.py 2>/dev/null",
   "-rw-r--r-- 1 root root 1633 Aug 13 01:43 /testbed/setup.py"
  ],
  [
   "Good, there are no extra test files to clean up.",
   "bash",
   "cd /testbed && git diff",
   "diff --git a/django/template/defaultfilters.py b/django/templ\u2026"
  ],
  [
   "The change is minimal and focused. Let me verify once more that all tests still pass and then sub\u2026",
   "bash",
   "cd /testbed/tests && python runtests.py template_tests.filter_tests.t\u2026",
   "Testing against Django installed in '/testbed/django' with up\u2026"
  ],
  [
   "All tests pass. The fix is complete and working.",
   "task_complete",
   "",
   "Task submitted."
  ]
 ]
};
</script>
<script>
// Steps 2 and 3 are illustrative: an invented turn 38 and next-token distributions shaped like the
// real ones (with the hint, the model puts its mass on wrapping up; without it, on exploring more).
const HINT_TURN = 38;
const HINT = "Note: you're close to your 40-turn limit, with about 3 turns left. You often keep exploring and forget to submit. Wrap up and call `task_complete`.";
// [token, candidates as [text, p without hint, p with hint]]; the first candidate is the token in the text
const THOUGHT = [
  ["Let", [["Let", .80, .62], ["I", .13, .18], ["All", .04, .15]]],
  [" me", [[" me", .99, .99]]],
  [" also", [[" also", .48, .07], [" run", .30, .09], [" wrap", .03, .36], [" submit", .02, .42]]],
  [" run", [[" run", .62, .55], [" check", .25, .30], [" look", .08, .06]]],
  [" the", [[" the", .86, .80], [" all", .10, .13]]],
  [" i18n", [[" i18n", .70, .62], [" full", .15, .20], [" remaining", .10, .12]]],
  [" tests", [[" tests", .97, .96]]],
  [".", [[".", .62, .38], [" too", .25, .22], [" and", .05, .32]]],
];
const CALL = ["bash", "(", "cd", " tests", " &&", " python", " runtests", ".py", " i18n", ")"]
  .map(t => [t, [[t, .98, .97]]]);

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const stage = document.getElementById("stage");
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

// The real prompt wraps the GitHub issue in instructions to fix it in the repo; one line stands in for those
const ASK = "Fix this issue in the django repo:";
const titleLine = TRAJ.problem.split("\n")[0];
const codeLines = ["floatformat('0.00', 0)", "ValueError: valid range for prec is [1, MAX_PREC]"];
const turns = TRAJ.turns;
// The turn after the hint is the one step 3 scores, so the deck holds the same text
turns[HINT_TURN - 1] = [THOUGHT.map(t => t[0]).join(""), "bash", CALL.slice(2, -1).map(t => t[0]).join(""), "Ran 93 tests in 1.2s"];
let deck = [];  // the user card, then one card per turn; the last one is in front

async function typeInto(node, text, cps) {
  for (let i = 1; i <= text.length; i += 2) { node.textContent = text.slice(0, i); await sleep(2000 / cps); }
  node.textContent = text;
}

// ---- The deck ----

// Seen from slightly above: each card behind sits a step higher, a bit narrower and a bit darker
const SHRINK = 0.0016, DIM = 0.006;
// A loosely squared deck: each card keeps its own small offset and tilt once it's behind the front one
const jitter = i => { const r = k => (Math.sin(i * 12.9898 + k * 78.233) * 43758.5453) % 1; return [r(1) * 3, r(2) * 0.45]; };
function layout(skipFront = false) {
  const step = parseFloat(getComputedStyle(stage).getPropertyValue("--step"));
  deck.forEach((card, i) => {
    if (skipFront && i === deck.length - 1) return;
    const depth = deck.length - 1 - i;
    const [dx, rot] = depth ? jitter(Number(card.dataset.seed)) : [0, 0];
    card.style.zIndex = i;
    const lift = Number(card.dataset.lift || 0);
    card.style.transform = `translateY(${-depth * step - lift}px) translateX(${dx}px) rotate(${rot}deg) scaleX(${1 - depth * SHRINK})`;
    card.style.filter = `brightness(${1 - Math.min(depth * DIM, 0.35)})`;
    card.classList.toggle("front", depth === 0);
  });
}

function deal(card, seed) {  // slides the card in from below, onto the front of the deck
  card.dataset.seed = seed;
  card.style.transform = "translateY(28px)";  // opaque from the start, so the cards behind never show through
  $("deckLayer").append(card);
  deck.push(card);
  layout(true);
  requestAnimationFrame(() => requestAnimationFrame(() => layout()));
}

function userCard() {
  const card = el("div", "card user"), ask = el("div", "line ask"), text = el("span"), issue = el("div", "issue");
  ask.append(el("span", "mark", ">"), text);
  issue.append(el("div", "title", titleLine), ...codeLines.map(l => el("div", "", l)));
  card.append(ask, issue);
  return { card, ask: text, issue };
}

function hintCard() {
  const card = el("div", "card hint"), ask = el("div", "wrap ask"), text = el("span");
  ask.append(el("span", "mark", ">"), text);
  card.append(ask);
  return { card, text };
}

// One turn as a terminal agent prints it: its thinking, its tool call, and the call's output
function turnCard(t) {
  const [thought, tool, cmd, out] = turns[t - 1];
  const card = el("div", "card"), th = el("div", "thought"), thText = el("span");
  th.append(el("span", "mark", "✻"), thText);
  const call = el("div", "line call" + (tool === "none" ? " bad" : "")), code = el("span");
  if (tool === "none") call.append(el("span", "mark", "⏺"), el("span", "name", "no valid tool call"));
  else call.append(el("span", "mark", "⏺"), el("span", "name", tool), "(", code, ")");
  const o = el("div", "line out"), oText = el("span");
  o.append(el("span", "mark", "⎿"), oText);
  o.style.visibility = "hidden";
  card.append(el("div", "head", `turn ${t}`), th, call, o);
  return { card, th: thText, code, o, oText, thought, cmd, out };
}

function fill(c) {
  c.th.textContent = c.thought; c.code.textContent = c.cmd;
  c.oText.textContent = c.out; c.o.style.visibility = c.out ? "" : "hidden";
}

async function turn(t, typed) {
  const c = turnCard(t);
  if (!typed) fill(c);
  deal(c.card, t);
  if (typed) {
    await sleep(200);
    await typeInto(c.th, c.thought, 260);
    await typeInto(c.code, c.cmd, 320);
    await sleep(120);
    c.oText.textContent = c.out; c.o.style.visibility = c.out ? "" : "hidden";
  }
}

// Time between dealt cards: quick, then a blur through the middle, then it lands on the last one
function gap(t) {
  const n = turns.length;
  if (t >= n - 2) return 260;
  if (t <= 10) return 380 - (t - 3) * 45;
  return 40;
}

// ---- Step 3 ----

function miniDeck(node, withHint) {
  node.replaceChildren();
  const n = 14;  // a few edges stand for the 37 turns before the hint
  for (let i = 0; i < n; i++) {
    const e = el("div", "edge");
    e.style.bottom = `${(n - i) * 3.4 + 2}px`;
    e.style.transform = `translateX(${jitter(i)[0] * 0.6}px) rotate(${jitter(i)[1] * 0.6}deg)`;
    node.append(e);
  }
  const face = el("div", "face" + (withHint ? " hint" : ""));
  if (withHint) face.append(el("b", "", "> "), HINT);
  else face.textContent = `turn ${HINT_TURN - 1} · ` + turns[HINT_TURN - 2][0];
  node.append(face);
}

// KL(with hint ‖ no hint) over the candidates, plus the rest of the vocabulary as one bucket
function kl(cands) {
  const rest = side => Math.max(1 - cands.reduce((s, c) => s + c[side], 0), 1e-3);
  const terms = cands.map(c => [c[1], c[2]]).concat([[rest(1), rest(2)]]);
  return Math.max(0, terms.reduce((s, [a, b]) => s + b * Math.log(b / a), 0));
}

// Green for tokens the hint barely changes, red for the ones it changes most
function klColor(k, alpha) {
  const x = Math.min(k / 1.5, 1);
  const g = [108, 194, 135], r = [229, 83, 75];
  const c = g.map((v, i) => Math.round(v + (r[i] - v) * x));
  return `rgb(${c.join(" ")} / ${alpha})`;
}

function buildTokens() {
  const card = $("tokcard");
  card.replaceChildren();
  const rows = [["thought-row", "✻ ", THOUGHT], ["", "⏺ ", CALL]];
  const spans = [];
  for (const [cls, mark, toks] of rows) {
    const row = el("div", "row " + cls);
    row.append(el("span", "", mark));
    for (const [text, cands] of toks) {
      const s = el("span", "tok", text);
      row.append(s);
      spans.push({ s, cands });
    }
    card.append(row);
  }
  return spans;
}

function showDist(cands) {
  const dist = $("dist");
  const shown = [...cands].sort((a, b) => Math.max(b[1], b[2]) - Math.max(a[1], a[2]));
  // Reuse four rows so the bars animate from one token's distribution to the next
  if (!dist.children.length) {
    for (let i = 0; i < 4; i++) {
      const bars = el("div", "bars");
      bars.append(el("div", "bar a"), el("div", "bar b"));
      dist.append(el("div", "cand"), bars);
    }
  }
  for (let i = 0; i < 4; i++) {
    const c = shown[i], label = dist.children[2 * i], bars = dist.children[2 * i + 1];
    label.textContent = c ? JSON.stringify(c[0]).slice(1, -1) : "";
    label.classList.toggle("sampled", !!c && c[0] === cands[0][0]);
    bars.children[0].style.width = c ? `${c[1] * 100}%` : "0";
    bars.children[1].style.width = c ? `${c[2] * 100}%` : "0";
  }
}

function showScore(k) {
  const score = $("score");
  score.replaceChildren(el("span", "", "KL ="), el("b", "", k.toFixed(2)));
  score.lastChild.style.color = klColor(k, 1);
}

async function score(spans, i, hold) {
  const { s, cands } = spans[i];
  spans.forEach(x => x.s.classList.remove("cur"));
  s.classList.add("cur");
  $("score").replaceChildren();
  showDist(cands);
  await sleep(hold * 0.55);
  const k = kl(cands);
  s.style.backgroundColor = klColor(k, 0.45);
  s.classList.add("scored");
  showScore(k);
  await sleep(hold * 0.45);
}

// ---- The loop ----

function reset() {
  stage.style.removeProperty("--step");
  $("deckLayer").replaceChildren();
  $("deckLayer").classList.remove("hidden");
  $("learn").classList.add("hidden");
  $("dist").replaceChildren();
  $("score").replaceChildren();
  deck = [];
}

async function play() {
  reset();

  // 1. The rollout: the model works on the task turn by turn, and the turns stack into a deck
  const u = userCard();
  deal(u.card, 0);
  await sleep(350);
  await typeInto(u.ask, ASK, 90);
  await sleep(150);
  u.issue.classList.add("show");  // pasted, not typed
  await sleep(1100);
  for (let t = 1; t <= 2; t++) { await turn(t, true); await sleep(t === 1 ? 850 : 350); }
  for (let t = 3; t <= turns.length; t++) { await turn(t, false); await sleep(gap(t)); }
  await sleep(1000);
  deck.forEach(c => c.classList.add("frozen"));
  await sleep(1600);

  // 2. The hint: written above the stored deck, then slid into it right before turn 38
  $("deckLayer").classList.add("slow");
  stage.style.setProperty("--step", `${parseFloat(getComputedStyle(stage).getPropertyValue("--step")) * 0.55}px`);
  layout();  // the deck squares up, leaving room above it
  await sleep(800);
  const h = hintCard();
  h.card.dataset.seed = 1000;
  h.card.style.zIndex = 1000;
  h.card.style.opacity = 0;
  $("deckLayer").append(h.card);
  h.card.style.transform = `translateY(${h.card.offsetHeight - stage.clientHeight}px)`;  // at the top of the frame
  requestAnimationFrame(() => requestAnimationFrame(() => { h.card.style.opacity = ""; }));
  await sleep(300);
  await typeInto(h.text, HINT, 110);
  await sleep(700);
  const GAP = 40;
  deck.slice(0, HINT_TURN).forEach(c => { c.dataset.lift = GAP; });
  layout();  // the deck opens between turns 37 and 38
  await sleep(800);
  h.card.dataset.lift = GAP;
  deck.splice(HINT_TURN, 0, h.card);
  layout();  // the hint slides into the gap, behind turn 38 and the rest
  await sleep(1900);
  $("deckLayer").classList.remove("slow");

  // 3. Learning: score each stored token in both contexts and compare
  miniDeck($("miniA"), false);
  miniDeck($("miniB"), true);
  const spans = buildTokens();
  $("deckLayer").classList.add("hidden");
  $("learn").classList.remove("hidden");
  await sleep(800);
  await score(spans, 0, 1500);
  await score(spans, 1, 900);
  await score(spans, 2, 3200);
  for (let i = 3; i < spans.length; i++) await score(spans, i, i < THOUGHT.length ? 450 : 160);
  spans.forEach(x => x.s.classList.remove("cur"));
  await sleep(2200);
  $("learn").classList.add("hidden");
  await sleep(600);
}

function still() {  // reduced motion: step 3's end state, no animation
  reset();
  miniDeck($("miniA"), false);
  miniDeck($("miniB"), true);
  const spans = buildTokens();
  spans.forEach(({ s, cands }) => { s.style.backgroundColor = klColor(kl(cands), 0.45); s.classList.add("scored"); });
  spans[2].s.classList.add("cur");
  showDist(spans[2].cands);
  showScore(kl(spans[2].cands));
  $("deckLayer").classList.add("hidden");
  $("learn").classList.remove("hidden");
}

if (reduced) still();
else (async () => { for (;;) await play(); })();
</script>
</body>
</html>
