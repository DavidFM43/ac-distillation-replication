<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-distillation figure</title>
<style>
:root {
  --bg: #fcfcfb; --ink: #1a1a19; --muted: #6b6a66; --faint: #b4b3ae; --line: #e6e5e1;
  --turn: #d6d5d0; --fixed: #ecebe7; --task: #3b3b38; --student: #3d7fd6; --teacher: #e09a2f; --hint: #e09a2f;
  --loss: #8a8984;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --faint: #5a5955; --line: #34342f; --turn: #4a4a46; --fixed: #2a2a28; --task: #c9c8c3; --loss: #9a9994; }
}
:root[data-theme="dark"] { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --faint: #5a5955; --line: #34342f; --turn: #4a4a46; --fixed: #2a2a28; --task: #c9c8c3; --loss: #9a9994; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
figure { margin: 32px auto 48px; max-width: 680px; padding: 0 16px; }
figcaption { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
figcaption b { color: var(--ink); }
svg { width: 100%; height: auto; display: block; overflow: visible; }
svg text { font-family: var(--mono); }
/* Everything moves or fades once per beat */
svg * { transition: transform .6s ease, opacity .5s ease, fill .4s ease, stroke .3s ease; }
.grow { transform-box: fill-box; transform-origin: center bottom; }
.grow.down { transform-origin: center top; }
.fast * { transition-duration: .15s; }
</style>
</head>
<body>
<figure>
  <figcaption><b>A</b> Named tokens, with a smooth curve behind the bars</figcaption>
  <svg id="figA" viewBox="0 0 600 310" role="img" aria-label="Offline self-distillation, version A"></svg>
</figure>
<figure>
  <figcaption><b>B</b> No token names: denser bars, the token in the rollout marked</figcaption>
  <svg id="figB" viewBox="0 0 600 310" role="img" aria-label="Offline self-distillation, version B"></svg>
</figure>
<script>
// Illustrative, not real data. A stored turn after the hint and, at each of its tokens, the main
// candidates for that position as [token, p student (no hint), p teacher (with hint)]; the token in the
// rollout is first. The rest of each distribution is a long tail.
const TOKENS = ["Let", " me", " also", " run", " the", " tests", "."];
const NEXT = [
  [["Let", .80, .62], ["I", .13, .18], ["All", .04, .15]],
  [[" me", .97, .96], [" us", .02, .03]],
  [[" also", .48, .07], [" run", .30, .09], [" submit", .02, .42], [" wrap", .03, .36]],
  [[" run", .62, .55], [" check", .25, .30], [" look", .08, .06]],
  [[" the", .86, .80], [" all", .10, .13]],
  [[" tests", .95, .94], [" suite", .03, .04]],
  [[".", .62, .38], [" and", .05, .32], [" too", .25, .22]],
];
// The tokens after that turn, scored at speed: [token, KL]. Mostly the hint changes nothing;
// now and then the model keeps exploring where the teacher would wrap up.
const MORE = [
  ["bash", .01], ["(", 0], ["cd", .02], [" tests", .01], [" &&", 0], [" python", .01], [" runtests", .03], [".py", 0], [")", 0],
  ["Ran", .02], [" 93", .01], [" tests", 0], [".", .05], ["All", .4], [" pass", .1], [".", .03], [" Let", .2], [" me", .01],
  [" check", .9], [" the", .05], [" docs", .6], [" too", .3], [".", .04], ["bash", .01], ["(", 0], ["grep", .05], [" -r", .02],
];
const HINT = "You're taking too long. Wrap up.";

// KL(teacher ‖ student) over the main candidates and the rest of the vocabulary
function kl(cands) {
  const rest = j => Math.max(1 - cands.reduce((t, c) => t + c[j], 0), 1e-3);
  return cands.map(c => [c[1], c[2]]).concat([[rest(1), rest(2)]]).reduce((t, [a, b]) => t + b * Math.log(b / a), 0);
}
function klColor(k) {
  const x = Math.min(Math.max(k, 0) / 1.2, 1), g = [95, 174, 120], r = [224, 87, 76];
  return `rgb(${g.map((v, i) => Math.round(v + (r[i] - v) * x)).join(" ")})`;
}

// A whole next-token distribution over `slots` candidates, ordered by the teacher's probability:
// the main candidates, then a long tail of unnamed tokens. [text, p student, p teacher, is target]
function distribution(i, slots) {
  const cands = [...NEXT[i]].sort((a, b) => b[2] - a[2]);
  const rest = j => Math.max(1 - cands.reduce((t, c) => t + c[j], 0), 0);
  const n = slots - cands.length, w = Array.from({ length: n }, (_, k) => 0.8 ** (k + 1)), W = w.reduce((a, b) => a + b, 0);
  const tail = w.map((v, k) => ["", rest(1) * v / W * (1 + .3 * Math.sin(k * 1.3 + i)), rest(2) * v / W * (1 + .3 * Math.sin(k * 1.9 + i)), false]);
  return cands.map(c => [c[0], c[1], c[2], c === NEXT[i][0]]).concat(tail);
}

// ---- One figure; STYLE "a" names the main candidates, "b" shows a denser, unnamed distribution ----

function figure(svg, STYLE) {
  const NS = "http://www.w3.org/2000/svg";
  const css = v => `var(--${v})`;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const frame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  function s(tag, attrs = {}, text, parent = svg) {
    const e = document.createElementNS(NS, tag);
    if (tag === "text") attrs = { fill: css("muted"), "font-size": 11, ...attrs };  // defaults as attributes, so each text can override them
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text != null) e.textContent = text;
    parent.append(e);
    return e;
  }
  const show = (e, on = true) => { e.style.opacity = on ? 1 : 0; };
  const move = (e, dx, dy) => { e.style.transform = `translate(${dx}px, ${dy}px)`; };

  // ---- Layout ----

  const N_TURNS = 16, HINT_AT = 8;  // the hint goes before the 8th turn shown
  const BW = 22, BH = 30, GAP = 5, X0 = 106, ROW_A = 50, ROW_B = 130;
  const bx = t => X0 + t * (BW + GAP);  // t = 0 is the task
  const ROW_Y = 118, CELL_H = 24, TOK_X = 250;  // the target tokens
  const LOSS_Y = 298, LOSS_H = 34;  // the per-token loss strip: bars stand on this line
  const VIEW_RIGHT = 540;  // the focused token stays left of this as the row scrolls
  const MEAN_X = 230;  // where the losses gather at the end
  const CHART = STYLE === "a" ? { slots: 9, gap: .55, sigma: .9 } : { slots: 30, gap: .35, sigma: 1.6 };
  const CHART_W = 180, CHART_H = 46;

  let el = {};

  function build() {
    svg.replaceChildren();
    el = { a: [], b: [], cells: [], offset: 0 };
    const hidden = { style: "opacity: 0" };

    // Rows: the rollout (A) and its copy with the hint (B). B starts on top of A and moves down.
    for (let t = 0; t <= N_TURNS; t++) {
      const fill = css(t ? "turn" : "task");
      el.a.push(s("rect", { x: bx(t), y: ROW_A, width: BW, height: BH, rx: 4, fill, ...hidden }));
      el.b.push(s("rect", { x: bx(t), y: ROW_A, width: BW, height: BH, rx: 4, fill, ...hidden }));
    }
    el.hint = s("rect", { x: bx(HINT_AT), y: ROW_B, width: BW, height: BH, rx: 4, fill: css("hint"), ...hidden });
    el.hintText = s("text", { x: bx(HINT_AT) + BW / 2, y: ROW_B + BH + 22, "text-anchor": "middle", fill: css("teacher"), ...hidden }, `“${HINT}”`);

    // The turns after the hint, outlined in both rows: the fixed tokens training looks at
    const outline = (y, shift) => s("rect", { x: bx(HINT_AT) + shift - 4, y: y - 4, width: bx(N_TURNS) - bx(HINT_AT) + BW + 8, height: BH + 8, rx: 7,
      fill: "none", stroke: css("ink"), "stroke-width": 1.2, "stroke-dasharray": "3 3", ...hidden });
    el.outA = outline(ROW_A, 0);
    el.outB = outline(ROW_B, BW + GAP);

    const label = (y, text, attrs = {}) => s("text", { x: 0, y, ...hidden, ...attrs }, text);
    el.lblA = label(ROW_A + 19, "rollout");
    el.lblB = label(ROW_B + 19, "rollout + hint");
    el.student = s("g", hidden);
    s("circle", { cx: 5, cy: ROW_A + 11, r: 4, fill: css("student") }, null, el.student);
    s("text", { x: 15, y: ROW_A + 15, fill: css("student") }, "student", el.student);
    s("text", { x: 15, y: ROW_A + 28, "font-size": 9.5 }, "the model", el.student);
    el.teacher = s("g", hidden);
    s("circle", { cx: 5, cy: ROW_B + 11, r: 4, fill: css("teacher") }, null, el.teacher);
    s("text", { x: 15, y: ROW_B + 15, fill: css("teacher") }, "teacher", el.teacher);
    s("text", { x: 15, y: ROW_B + 28, "font-size": 9.5 }, "same model", el.teacher);

    // Target tokens and their loss bars, on a track that scrolls; clipped so it never runs into the labels
    const clip = s("clipPath", { id: `trackClip${STYLE}` }, null, s("defs"));
    s("rect", { x: 56, y: 0, width: 560, height: 320 }, null, clip);
    const window_ = s("g", { "clip-path": `url(#trackClip${STYLE})` });
    el.track = s("g", {}, null, window_);
    el.nextX = TOK_X;
    TOKENS.forEach(t => addCell(t));
    const last = el.cells[el.cells.length - 1];
    el.more = s("text", { x: last.x + last.w + 10, y: ROW_Y + 16, "font-size": 13, ...hidden }, "…", el.track);

    // ...under a wedge that opens out of one fixed turn
    el.wedge = s("path", { d: `M${bx(HINT_AT)},${ROW_A - 30 + BH} L${bx(HINT_AT) + BW},${ROW_A - 30 + BH} L${last.x + last.w + 24},${ROW_Y - 2} L${TOK_X},${ROW_Y - 2} Z`,
      fill: css("fixed"), ...hidden });
    svg.insertBefore(el.wedge, window_);
    el.picked = s("rect", { x: bx(HINT_AT), y: ROW_A, width: BW, height: BH, rx: 4, fill: "none", stroke: css("ink"), "stroke-width": 1.5, ...hidden });
    el.lblTarget = label(ROW_Y + 16, "target");
    el.lblLoss = label(LOSS_Y - 4, "loss");
    el.lossLine = s("line", { x1: 56, x2: 600, y1: LOSS_Y, y2: LOSS_Y, stroke: css("line"), ...hidden });

    // Each model's context, laid right before the target tokens
    el.ctx = { student: context("student"), teacher: context("teacher") };

    // The end: the per-token losses average into one number, the training signal
    el.mean = s("g", hidden);
    el.meanBar = s("rect", { class: "grow", x: MEAN_X - 14, y: LOSS_Y - LOSS_H, width: 28, height: LOSS_H, rx: 2, fill: css("ink"), style: "transform: scaleY(0)" }, null, el.mean);
    el.meanText = s("text", { x: MEAN_X + 24, y: LOSS_Y - 18, fill: css("ink"), "font-size": 12 }, "", el.mean);
    s("text", { x: MEAN_X + 24, y: LOSS_Y - 4, "font-size": 10 }, "mean over every target token: the training signal", el.mean);
  }

  function addCell(t, k = null) {
    const x = el.nextX, w = Math.max(t.trim().length * 8 + 16, 30);
    const g = s("g", { style: "opacity: 0" }, null, el.track);
    const r = s("rect", { x, y: ROW_Y, width: w, height: CELL_H, rx: 4, fill: css("fixed"), stroke: css("turn") }, null, g);
    s("text", { x: x + w / 2, y: ROW_Y + 16, "text-anchor": "middle", fill: css("ink"), "font-size": 12 }, t.trim() || "␣", g);
    const cell = { g, r, x, w, c: x + w / 2, k };
    el.cells.push(cell);
    el.nextX += w + 8;
    return cell;
  }

  function context(who) {
    const g = s("g", { style: "opacity: 0" });
    const bw = 16, gp = 4, hint = who === "teacher";
    const blocks = ["task", ...Array(7).fill("turn"), ...(hint ? ["hint"] : [])];
    let x = TOK_X - 10 - blocks.length * (bw + gp) + gp;
    const x0 = x;
    for (const b of blocks) { s("rect", { x, y: ROW_Y + 1, width: bw, height: CELL_H - 2, rx: 3, fill: css(b) }, null, g); x += bw + gp; }
    s("rect", { x: x0 - 4, y: ROW_Y - 3, width: x - gp - x0 + 8, height: CELL_H + 6, rx: 6, fill: "none", stroke: css(who), "stroke-width": 1.5 }, null, g);
    s("text", { x: x0 - 4, y: ROW_Y + CELL_H + 18, "font-size": 9.5, fill: css(who) }, hint ? "rollout + hint" : "rollout", g);
    return g;
  }

  // The two distributions at token i, mirrored around the token: the teacher's above, the student's below,
  // same candidates in the same order (by the teacher's probability). Heights are √p, so the tail shows;
  // a smooth curve (a Gaussian KDE over the bars) sits behind each.
  function chart(i) {
    const d = distribution(i, CHART.slots), slot = CHART_W / d.length, bw = slot * (1 - CHART.gap);
    const c = el.cells[i].c + el.offset;  // the chart isn't on the scrolling track
    const x0 = Math.min(Math.max(c - CHART_W / 2, 70), 600 - CHART_W - 20);
    const cx = k => x0 + (k + .5) * slot, hgt = p => Math.sqrt(p) * CHART_H;
    const g = s("g", { style: "opacity: 0" });
    const parts = { student: [], teacher: [] };
    for (const [who, j, base, dir] of [["teacher", 2, ROW_Y - 12, -1], ["student", 1, ROW_Y + CELL_H + 12, 1]]) {
      // the curve
      const pts = [];
      for (let x = x0 - slot; x <= x0 + CHART_W + slot * 1.5; x += 1.5) {
        pts.push([x, d.reduce((t, cand, k) => t + hgt(cand[j]) * Math.exp(-((x - cx(k)) ** 2) / (2 * (CHART.sigma * slot) ** 2)), 0)]);
      }
      const peak = Math.max(...pts.map(p => p[1])), top = Math.max(...d.map(cand => hgt(cand[j])));
      const path = `M${pts[0][0]},${base} ` + pts.map(([x, v]) => `L${x.toFixed(1)},${(base + dir * v / peak * top * 1.08).toFixed(1)}`).join(" ") + ` L${pts[pts.length - 1][0]},${base} Z`;
      parts[who].push(s("path", { class: `grow${dir > 0 ? " down" : ""}`, d: path, fill: css(who), opacity: .25, style: "transform: scaleY(0)" }, null, g));
      // the bars
      d.forEach((cand, k) => {
        const h = Math.max(.8, hgt(cand[j]));
        parts[who].push(s("rect", { class: `grow${dir > 0 ? " down" : ""}`, x: cx(k) - bw / 2, y: dir < 0 ? base - h : base, width: bw, height: h,
          fill: css(who), style: "transform: scaleY(0)" }, null, g));
      });
      s("line", { x1: x0 - slot, x2: x0 + CHART_W + slot * 1.5, y1: base, y2: base, stroke: css("turn") }, null, g);
      parts[who + "Label"] = s("text", { x: x0 - slot - 6, y: base + dir * 12 + 4, "text-anchor": "end", "font-size": 10, fill: css(who), style: "opacity: 0" }, who, g);
    }
    const tk = d.findIndex(cand => cand[3]), sb = ROW_Y + CELL_H + 12;
    if (STYLE === "a") {
      // names under the student's side; the target token in bold
      d.forEach((cand, k) => {
        if (!cand[0]) return;
        const lx = cx(k) + 3, ly = sb + CHART_H + 14;
        s("text", { x: lx, y: ly, "text-anchor": "end", transform: `rotate(-40 ${lx} ${ly})`, "font-size": 9.5,
          ...(cand[3] ? { fill: css("ink"), "font-weight": 700 } : {}) }, cand[0].trim(), g);
      });
    } else {
      // no names: just mark the token in the rollout
      const y = sb + CHART_H + 8;
      s("path", { d: `M${cx(tk) - 4},${y + 6} L${cx(tk) + 4},${y + 6} L${cx(tk)},${y} Z`, fill: css("ink") }, null, g);
    }
    return { g, parts };
  }
  async function grow(ch, who) {
    show(ch.g); show(ch.parts[who + "Label"]);
    await frame();
    ch.parts[who].forEach(b => { b.style.transform = "scaleY(1)"; });
  }
  function drop(ch) { show(ch.g, false); setTimeout(() => ch.g.remove(), 600); }

  // Only the token being scored stands out; the others wait, scored or not
  function focusOn(i) {
    el.cells.forEach((cell, j) => {
      cell.r.style.fill = css("fixed");
      cell.r.style.stroke = j === i ? css("ink") : css("turn");
      cell.r.setAttribute("stroke-width", j === i ? 1.5 : 1);
      cell.g.style.opacity = i === null || j === i ? 1 : .35;
    });
    const cell = el.cells[i];
    if (cell && cell.c + el.offset > VIEW_RIGHT) { el.offset = VIEW_RIGHT - cell.c; move(el.track, el.offset, 0); }  // keep it in view
  }

  // Compare: the token shows its score, and its loss goes into the strip below
  function score(i, k, { number = true } = {}) {
    const cell = el.cells[i];
    cell.r.style.fill = klColor(k);
    const h = 1.5 + Math.min(k / 1.5, 1) * LOSS_H;
    const bar = s("rect", { class: "grow", x: cell.c - 4, y: LOSS_Y - h, width: 8, height: h, rx: 1.5, fill: css("loss"), style: "transform: scaleY(0)" }, null, el.track);
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transform = "scaleY(1)"; }));
    cell.bar = bar;
    if (number) {
      const t = s("text", { x: cell.c, y: LOSS_Y - h - 5, "text-anchor": "middle", "font-size": 9.5, fill: css("ink"), style: "opacity: 0" }, k.toFixed(2), el.track);
      requestAnimationFrame(() => show(t));
      setTimeout(() => show(t, false), 1400);
    }
    cell.k = k;
  }

  // ---- The loop ----

  async function play() {
    build();
    await frame();

    // 1. The rollout: a finished sequence of turns
    show(el.lblA);
    for (const r of el.a) { show(r); await sleep(70); }
    await sleep(1000);

    // 2. The same rollout with a hint in the middle; the turns after it are the same, shifted over
    show(el.lblB);
    el.b.forEach(r => { show(r); move(r, 0, ROW_B - ROW_A); });
    await sleep(800);
    el.b.forEach((r, t) => { if (t >= HINT_AT) move(r, BW + GAP, ROW_B - ROW_A); });
    move(el.hint, 0, -24);
    await sleep(450);
    show(el.hint); move(el.hint, 0, 0);
    await sleep(400);
    show(el.hintText);
    await sleep(1800);

    // 3. One model reads both: the student the plain rollout, the teacher the rollout with the hint.
    //    Training looks only at the turns after the hint, the same fixed tokens in both.
    show(el.lblA, false); show(el.lblB, false); show(el.hintText, false);
    await sleep(300);
    show(el.student); show(el.teacher);
    await sleep(600);
    show(el.outA); show(el.outB);
    await sleep(2400);

    // 4. The target tokens come straight out of the fixed rollout, and there are many more of them
    [el.student, el.teacher, el.outB, el.hint, ...el.b].forEach(e => show(e, false));
    await sleep(500);
    [...el.a, el.outA, el.picked].forEach(e => move(e, 0, -30));
    await sleep(500);
    show(el.picked);
    show(el.wedge);
    await sleep(300);
    for (const cell of el.cells) { show(cell.g); await sleep(70); }
    show(el.more);
    show(el.lblTarget);
    await sleep(1700);

    // Score them one at a time, starting with the first
    [...el.a, el.outA, el.picked, el.wedge, el.lblTarget].forEach(e => show(e, false));
    show(el.lblLoss); show(el.lossLine);
    focusOn(0);
    await sleep(900);

    // The student reads its context and gives its distribution for this token...
    const first = chart(0);
    show(el.ctx.student);
    await sleep(500);
    await grow(first, "student");
    await sleep(1700);
    // ...then the teacher's context swaps in: the same rollout plus the hint
    show(el.ctx.student, false);
    await sleep(350);
    show(el.ctx.teacher);
    await sleep(500);
    await grow(first, "teacher");
    await sleep(1800);
    show(el.ctx.teacher, false);
    await sleep(300);
    // Compare the two: that's this token's loss
    score(0, kl(NEXT[0]));
    await sleep(1500);
    drop(first);
    await sleep(380);

    // The next tokens, the same way
    for (let i = 1; i < TOKENS.length; i++) {
      const key = i === 2, quick = i > 2;
      focusOn(i);
      await sleep(quick ? 150 : 350);
      const ch = chart(i);
      await grow(ch, "student"); await grow(ch, "teacher");
      await sleep(key ? 2400 : quick ? 450 : 900);
      score(i, kl(NEXT[i]));
      await sleep(key ? 1500 : quick ? 300 : 700);
      drop(ch);
      await sleep(380);
    }

    // ...and on through every token of every fixed turn, faster
    show(el.more, false);
    svg.classList.add("fast");
    for (const [t, k] of MORE) {
      const cell = addCell(t, k);
      show(cell.g);
      focusOn(el.cells.length - 1);
      await sleep(90);
      score(el.cells.length - 1, k, { number: false });
      await sleep(70);
    }
    svg.classList.remove("fast");
    focusOn(null);
    await sleep(900);

    // The losses average into one number: the training signal
    const ks = el.cells.map(c => c.k);
    const mean = ks.reduce((a, b) => a + b, 0) / ks.length;
    el.cells.forEach(c => show(c.g, false));
    await sleep(400);
    el.cells.forEach(c => {  // every token's loss bar slides into one place...
      c.bar.style.transition = "transform .9s ease, opacity .9s ease";
      c.bar.style.transform = `translate(${MEAN_X - el.offset - c.c}px, 0)`;
      c.bar.style.opacity = 0;
    });
    await sleep(800);
    show(el.track, false);
    el.meanText.textContent = `loss = ${mean.toFixed(2)}`;
    el.meanBar.setAttribute("height", 1.5 + Math.min(mean / 1.5, 1) * LOSS_H);
    el.meanBar.setAttribute("y", LOSS_Y - (1.5 + Math.min(mean / 1.5, 1) * LOSS_H));
    show(el.mean);
    await frame();
    el.meanBar.style.transform = "scaleY(1)";
    await sleep(3200);
    [el.mean, el.lblLoss, el.lossLine].forEach(e => show(e, false));
    await sleep(900);
  }

  function still() {  // reduced motion: the moment the hint matters
    build();
    el.cells.forEach(c => show(c.g));
    show(el.more); show(el.lblLoss); show(el.lossLine);
    focusOn(2);
    [0, 1, 2].forEach(i => score(i, kl(NEXT[i]), { number: false }));
    [0, 1].forEach(i => { el.cells[i].r.style.fill = css("fixed"); });
    const ch = chart(2);
    show(ch.g); show(ch.parts.studentLabel); show(ch.parts.teacherLabel);
    [...ch.parts.student, ...ch.parts.teacher].forEach(b => { b.style.transform = "none"; });
  }

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) still();
  else (async () => { for (;;) await play(); })();
}

figure(document.getElementById("figA"), "a");
figure(document.getElementById("figB"), "b");
</script>
</body>
