<title>Self-distillation figure</title>
<style>
:root {
  --bg: #fcfcfb;
  /* The cards are terminal panes, dark in both page themes */
  --term: #161615;
  --term-edge: #3a3a36;
  --term-top: #6a6964;  /* the top edge, what shows of each card behind the front one */
  --term-ink: #e8e6e1;
  --term-dim: #8e8d87;
  --term-faint: #63625d;
  --ok: #6cc287;
  --warn: #e0a458;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1f1f1e; --term: #121211; --term-edge: #3f3f3b; }
}
:root[data-theme="dark"] { --bg: #1f1f1e; --term: #121211; --term-edge: #3f3f3b; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); font-family: var(--mono); }
figure { margin: 40px auto; max-width: 760px; padding: 0 16px; }

/* Every card has the same height, so the cards behind the front one show as evenly spaced edges */
.stage { --h: 108px; --step: 4px; height: 410px; max-width: 600px; margin: 0 auto; position: relative; transition: opacity .6s ease, filter 1s ease; }
.stage.frozen { filter: grayscale(1); opacity: .72; }
.stage.fading { opacity: 0; }
.card {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--h);
  background: var(--term); border: 1px solid var(--term-edge); border-top-color: var(--term-top); border-radius: 7px;
  padding: 10px 14px; font: 12px/1.55 var(--mono); color: var(--term-ink); overflow: hidden;
  transform-origin: 50% 100%;
  transition: transform .28s ease, box-shadow .28s ease, filter .28s ease;
}
.card { box-shadow: 0 -1px 0 rgb(0 0 0 / .55); }  /* a dark line above each card sets its light top edge apart */
.card.front { box-shadow: 0 -1px 0 rgb(0 0 0 / .55), 0 8px 22px -12px rgb(0 0 0 / .5); }
.head { position: absolute; top: 9px; right: 12px; font-size: 10.5px; color: var(--term-faint); }
.line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.55em; padding-right: 56px; }
.mark { display: inline-block; width: 2ch; }
.ask .mark { color: var(--term-dim); }
.issue { padding-left: 2ch; color: var(--term-dim); opacity: 0; transition: opacity .35s ease; }
.issue.show { opacity: 1; }
.issue .title { color: var(--term-ink); }
.issue div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thought {
  color: var(--term-dim); font-style: italic; min-height: 1.55em; padding-right: 56px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.thought .mark { font-style: normal; }
.call .mark { color: var(--ok); }
.call.bad .mark, .call.bad .name { color: var(--warn); }
.name { font-weight: 600; }
.out { color: var(--term-dim); padding-left: 2ch; }
.out .mark { color: var(--term-faint); }

@media (max-width: 520px) {
  .stage { --h: 124px; --step: 3px; height: 360px; }
  .card { font-size: 11px; padding: 9px 11px; }
}
</style>
</head>

<script>
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const stage = document.getElementById("stage");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

// The real prompt wraps the GitHub issue in instructions to fix it in the repo; one line stands in for those
const ASK = "Fix this issue in the django repo:";
const titleLine = TRAJ.problem.split("\n")[0];
const codeLines = ["floatformat('0.00', 0)", "ValueError: valid range for prec is [1, MAX_PREC]"];
const turns = TRAJ.turns;
let deck = [];  // the user card, then one card per turn; the last one is in front

async function typeInto(node, text, cps) {
  for (let i = 1; i <= text.length; i += 2) { node.textContent = text.slice(0, i); await sleep(2000 / cps); }
  node.textContent = text;
}

// Seen from slightly above: each card behind sits a step higher, a bit narrower and a bit darker
const SHRINK = 0.0016, DIM = 0.006;
// A loosely squared deck: each card keeps its own small offset and tilt once it's behind the front one
const jitter = i => { const r = k => (Math.sin(i * 12.9898 + k * 78.233) * 43758.5453) % 1; return [r(1) * 3, r(2) * 0.45]; };
function layout(skipFront = false) {
  const step = parseFloat(getComputedStyle(stage).getPropertyValue("--step"));
  deck.forEach((card, i) => {
    if (skipFront && i === deck.length - 1) return;
    const depth = deck.length - 1 - i;
    card.style.zIndex = i;
    const [dx, rot] = depth ? jitter(i) : [0, 0];
    card.style.transform = `translateY(${-depth * step}px) translateX(${dx}px) rotate(${rot}deg) scaleX(${1 - depth * SHRINK})`;
    card.style.filter = `brightness(${1 - Math.min(depth * DIM, 0.35)})`;
    card.classList.toggle("front", depth === 0);
  });
}

function deal(card) {  // slides the card in from below, onto the front of the deck
  card.style.transform = "translateY(28px)";  // opaque from the start, so the cards behind never show through
  stage.append(card);
  deck.push(card);
  layout(true);
  requestAnimationFrame(() => requestAnimationFrame(() => layout()));
}

function userCard() {
  const card = el("div", "card user"), ask = el("div", "line ask"), text = el("span"), issue = el("div", "issue");
  ask.append(el("span", "mark", ">"), text);
  issue.append(el("div", "title", titleLine), ...codeLines.map(l => el("div", "", l)));
  card.append(ask, issue);
  return { card, ask: text, issue };
}

// One turn as a terminal agent prints it: its thinking, its tool call, and the call's output
function turnCard(t) {
  const [thought, tool, cmd, out] = turns[t - 1];
  const card = el("div", "card"), th = el("div", "thought"), thText = el("span");
  th.append(el("span", "mark", "✻"), thText);
  const call = el("div", "line call" + (tool === "none" ? " bad" : "")), code = el("span");
  if (tool === "none") call.append(el("span", "mark", "⏺"), el("span", "name", "no valid tool call"));
  else call.append(el("span", "mark", "⏺"), el("span", "name", tool), "(", code, ")");
  const o = el("div", "line out"), oText = el("span");
  o.append(el("span", "mark", "⎿"), oText);
  o.style.visibility = "hidden";
  card.append(el("div", "head", `turn ${t}`), th, call, o);
  return { card, th: thText, code, o, oText, thought, cmd, out };
}

async function turn(t, typed) {
  const c = turnCard(t);
  const showOut = () => { c.oText.textContent = c.out; c.o.style.visibility = c.out ? "" : "hidden"; };
  if (!typed) { c.th.textContent = c.thought; c.code.textContent = c.cmd; showOut(); }
  deal(c.card);
  if (typed) {
    await sleep(200);
    await typeInto(c.th, c.thought, 260);
    await typeInto(c.code, c.cmd, 320);
    await sleep(120);
    showOut();
  }
}

// Time between dealt cards: quick, then a blur through the middle, then it lands on the last one
function gap(t) {
  const n = turns.length;
  if (t >= n - 2) return 260;
  if (t <= 10) return 380 - (t - 3) * 45;
  return 40;
}

function reset() {
  stage.classList.remove("frozen", "fading");
  stage.replaceChildren();
  deck = [];
}

async function play() {
  reset();
  const u = userCard();
  deal(u.card);
  await sleep(350);
  await typeInto(u.ask, ASK, 90);
  await sleep(150);
  u.issue.classList.add("show");  // pasted, not typed
  await sleep(1100);
  for (let t = 1; t <= 2; t++) { await turn(t, true); await sleep(t === 1 ? 850 : 350); }
  for (let t = 3; t <= turns.length; t++) { await turn(t, false); await sleep(gap(t)); }
  await sleep(1100);
  stage.classList.add("frozen");
  await sleep(2400);
  stage.classList.add("fading");
  await sleep(700);
}

function still() {  // reduced motion: the finished deck, no animation
  reset();
  const u = userCard(); u.ask.textContent = ASK; u.issue.classList.add("show");
  stage.append(u.card); deck.push(u.card);
  for (let t = 1; t <= turns.length; t++) {
    const c = turnCard(t); c.th.textContent = c.thought; c.code.textContent = c.cmd;
    c.oText.textContent = c.out; c.o.style.visibility = c.out ? "" : "hidden";
    stage.append(c.card); deck.push(c.card);
  }
  layout();
  stage.classList.add("frozen");
}

if (reduced) still();
else (async () => { for (;;) await play(); })();
</script>
