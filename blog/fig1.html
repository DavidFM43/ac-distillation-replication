<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-distillation figure</title>
<style>
:root {
  --bg: #fcfcfb; --ink: #1a1a19; --muted: #6b6a66; --faint: #b4b3ae; --line: #e6e5e1;
  --turn: #d6d5d0; --fixed: #ecebe7; --task: #3b3b38; --student: #3d7fd6; --teacher: #e09a2f; --hint: #e09a2f;
  --good: #5fae78;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --faint: #5a5955; --line: #34342f; --turn: #4a4a46; --fixed: #2a2a28; --task: #c9c8c3; }
}
:root[data-theme="dark"] { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --faint: #5a5955; --line: #34342f; --turn: #4a4a46; --fixed: #2a2a28; --task: #c9c8c3; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
figure { margin: 40px auto; max-width: 680px; padding: 0 16px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
svg text { font-family: var(--mono); }
/* Everything moves or fades once per beat */
svg * { transition: transform .6s ease, opacity .5s ease, fill .5s ease, stroke .3s ease; }
.bar { transform-box: fill-box; }
.bar.up { transform-origin: center bottom; }
.bar.down { transform-origin: center top; }
</style>
</head>
<body>
<figure>
  <svg id="fig" viewBox="0 0 600 260" role="img"
       aria-label="Offline self-distillation: a fixed rollout, the same rollout with a hint, and each target token scored by comparing the model's next-token distributions with and without the hint"></svg>
</figure>
<script>
// Illustrative, not real data: a stored turn after the hint and what each model would put at each of
// its tokens, as [token, p student (no hint), p teacher (with hint)]; the token in the rollout is first.
const TOKENS = ["Let", " me", " also", " run", " the", " tests", "."];
const NEXT = [
  [["Let", .80, .62], ["I", .13, .18], ["All", .04, .15]],
  [[" me", .97, .96], [" us", .02, .03]],
  [[" also", .48, .07], [" run", .30, .09], [" submit", .02, .42], [" wrap", .03, .36]],
  [[" run", .62, .55], [" check", .25, .30], [" look", .08, .06]],
  [[" the", .86, .80], [" all", .10, .13]],
  [[" tests", .95, .94], [" suite", .03, .04]],
  [[".", .62, .38], [" and", .05, .32], [" too", .25, .22]],
];
const HINT = "You're taking too long. Wrap up.";

const svg = document.getElementById("fig");
const NS = "http://www.w3.org/2000/svg";
const css = v => `var(--${v})`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
function s(tag, attrs = {}, text, parent = svg) {
  const e = document.createElementNS(NS, tag);
  if (tag === "text") attrs = { fill: css("muted"), "font-size": 11, ...attrs };  // defaults as attributes, so each text can override them
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  parent.append(e);
  return e;
}
const show = (e, on = true) => { e.style.opacity = on ? 1 : 0; };
const move = (e, dx, dy) => { e.style.transform = `translate(${dx}px, ${dy}px)`; };

// KL(teacher ‖ student) over the candidates and the rest of the vocabulary, as a green-to-red color
function kl(cands) {
  const rest = j => Math.max(1 - cands.reduce((t, c) => t + c[j], 0), 1e-3);
  return cands.map(c => [c[1], c[2]]).concat([[rest(1), rest(2)]]).reduce((t, [a, b]) => t + b * Math.log(b / a), 0);
}
function klColor(k) {
  const x = Math.min(Math.max(k, 0) / 1.2, 1), g = [95, 174, 120], r = [224, 87, 76];
  return `rgb(${g.map((v, i) => Math.round(v + (r[i] - v) * x)).join(" ")})`;
}

// ---- Layout ----

const N_TURNS = 16, HINT_AT = 8;  // the hint goes before the 8th turn shown
const BW = 22, BH = 30, GAP = 5, X0 = 106, ROW_A = 50, ROW_B = 130;
const bx = t => X0 + t * (BW + GAP);  // t = 0 is the task
const ROW_Y = 130, CELL_H = 24, TOK_X = 250;  // the target tokens

let el = {};

function build() {
  svg.replaceChildren();
  el = { a: [], b: [], cells: [] };
  const hidden = { style: "opacity: 0" };

  // Rows: the rollout (A) and its copy with the hint (B). B starts on top of A and moves down.
  for (let t = 0; t <= N_TURNS; t++) {
    const fill = css(t ? "turn" : "task");
    el.a.push(s("rect", { x: bx(t), y: ROW_A, width: BW, height: BH, rx: 4, fill, ...hidden }));
    el.b.push(s("rect", { x: bx(t), y: ROW_A, width: BW, height: BH, rx: 4, fill, ...hidden }));
  }
  el.hint = s("rect", { x: bx(HINT_AT), y: ROW_B, width: BW, height: BH, rx: 4, fill: css("hint"), ...hidden });
  el.hintText = s("text", { x: bx(HINT_AT) + BW / 2, y: ROW_B + BH + 22, "text-anchor": "middle", fill: css("teacher"), ...hidden }, `“${HINT}”`);

  // The turns after the hint, outlined in both rows: the fixed tokens training looks at
  const outline = (y, shift) => s("rect", { x: bx(HINT_AT) + shift - 4, y: y - 4, width: bx(N_TURNS) - bx(HINT_AT) + BW + 8, height: BH + 8, rx: 7,
    fill: "none", stroke: css("ink"), "stroke-width": 1.2, "stroke-dasharray": "3 3", ...hidden });
  el.outA = outline(ROW_A, 0);
  el.outB = outline(ROW_B, BW + GAP);

  const label = (y, text, attrs = {}) => s("text", { x: 0, y, ...hidden, ...attrs }, text);
  el.lblA = label(ROW_A + 19, "rollout");
  el.lblB = label(ROW_B + 19, "rollout + hint");
  el.student = s("g", hidden);
  s("circle", { cx: 5, cy: ROW_A + 11, r: 4, fill: css("student") }, null, el.student);
  s("text", { x: 15, y: ROW_A + 15, fill: css("student") }, "student", el.student);
  s("text", { x: 15, y: ROW_A + 28, "font-size": 9.5 }, "the model", el.student);
  el.teacher = s("g", hidden);
  s("circle", { cx: 5, cy: ROW_B + 11, r: 4, fill: css("teacher") }, null, el.teacher);
  s("text", { x: 15, y: ROW_B + 15, fill: css("teacher") }, "teacher", el.teacher);
  s("text", { x: 15, y: ROW_B + 28, "font-size": 9.5 }, "same model", el.teacher);

  // Target tokens, under a wedge that opens out of one fixed turn
  let x = TOK_X;
  const xs = TOKENS.map(t => { const w = Math.max(t.trim().length * 8 + 16, 32); const c = { x, w }; x += w + 8; return c; });
  const last = xs[xs.length - 1];
  el.wedge = s("path", { d: `M${bx(HINT_AT)},${ROW_A - 30 + BH} L${bx(HINT_AT) + BW},${ROW_A - 30 + BH} L${last.x + last.w},${ROW_Y - 2} L${TOK_X},${ROW_Y - 2} Z`,
    fill: css("fixed"), ...hidden });
  el.picked = s("rect", { x: bx(HINT_AT), y: ROW_A, width: BW, height: BH, rx: 4, fill: "none", stroke: css("ink"), "stroke-width": 1.5, ...hidden });
  el.lblTarget = label(ROW_Y + 16, "target");
  TOKENS.forEach((t, i) => {
    const g = s("g", hidden);
    const r = s("rect", { x: xs[i].x, y: ROW_Y, width: xs[i].w, height: CELL_H, rx: 4, fill: css("fixed"), stroke: css("turn") }, null, g);
    s("text", { x: xs[i].x + xs[i].w / 2, y: ROW_Y + 16, "text-anchor": "middle", fill: css("ink"), "font-size": 12 }, t.trim(), g);
    el.cells.push({ g, r, c: xs[i].x + xs[i].w / 2 });
  });

  // Each model's context, laid right before the target tokens
  el.ctx = { student: context("student"), teacher: context("teacher") };

  // The payoff: a rollout from the trained model, no hint, that submits sooner
  el.lblBefore = label(ROW_A + 19, "before");
  el.lblAfter = label(ROW_B + 19, "after training");
  el.after = [];
  for (let t = 0; t <= 10; t++) {
    el.after.push(s("rect", { x: bx(t), y: ROW_B, width: BW, height: BH, rx: 4, fill: css(t ? "turn" : "task"),
      ...(t === 10 ? { stroke: css("good"), "stroke-width": 2 } : {}), ...hidden }));
  }
  el.submitText = s("text", { x: bx(10) + BW + 8, y: ROW_B + 19, fill: css("good"), ...hidden }, "submits");
}

function context(who) {
  const g = s("g", { style: "opacity: 0" });
  const bw = 16, gp = 4, hint = who === "teacher";
  const blocks = ["task", ...Array(7).fill("turn"), ...(hint ? ["hint"] : [])];
  let x = TOK_X - 10 - blocks.length * (bw + gp) + gp;
  const x0 = x;
  for (const b of blocks) { s("rect", { x, y: ROW_Y + 1, width: bw, height: CELL_H - 2, rx: 3, fill: css(b) }, null, g); x += bw + gp; }
  s("rect", { x: x0 - 4, y: ROW_Y - 3, width: x - gp - x0 + 8, height: CELL_H + 6, rx: 6, fill: "none", stroke: css(who), "stroke-width": 1.5 }, null, g);
  s("text", { x: x0 - 4, y: ROW_Y - 10, "font-size": 9.5, fill: css(who) }, hint ? "rollout + hint" : "rollout", g);
  return g;
}

// A model's distribution at token i: teacher above the row, student below, bars growing from the row
function chart(i, who) {
  const above = who === "teacher", side = above ? 2 : 1;
  const cands = NEXT[i], bw = 22, gap = 12, H = 50, c = el.cells[i].c;
  const x0 = c - (cands.length * (bw + gap) - gap) / 2;
  const base = above ? ROW_Y - 20 : ROW_Y + CELL_H + 20;
  const g = s("g", { style: "opacity: 0" });
  const bars = cands.map((cand, k) => {
    const h = Math.max(2, cand[side] * H), x = x0 + k * (bw + gap);
    s("text", { x: x + bw / 2, y: above ? base + 11 : base - 4, "text-anchor": "middle", "font-size": 9.5,
      ...(k === 0 ? { fill: css("ink"), "font-weight": 700 } : {}) }, cand[0].trim(), g);  // the target token in bold
    return s("rect", { class: `bar ${above ? "up" : "down"}`, x, y: above ? base - h : base, width: bw, height: h, rx: 2,
      fill: css(who), style: "transform: scaleY(0)" }, null, g);
  });
  s("line", { x1: x0 - 6, x2: x0 + cands.length * (bw + gap) - gap + 6, y1: base, y2: base, stroke: css("turn") }, null, g);
  s("text", { x: x0 + cands.length * (bw + gap) + 4, y: above ? base - H / 2 : base + H / 2 + 4, fill: css(who) }, who, g);
  return { g, bars };
}

async function grow(ch) {
  show(ch.g);
  await frame();
  ch.bars.forEach(b => { b.style.transform = "scaleY(1)"; });
}
function drop(ch) { show(ch.g, false); setTimeout(() => ch.g.remove(), 600); }

function focusOn(i) {
  el.cells.forEach((cell, j) => {
    cell.r.style.stroke = j === i ? css("ink") : css("turn");
    cell.r.setAttribute("stroke-width", j === i ? 1.5 : 1);
    if (!cell.scored) cell.g.style.opacity = i === null || j <= i ? 1 : .3;  // the tokens after the focus wait
  });
}
function scoreCell(i) {
  el.cells[i].scored = true;
  el.cells[i].r.style.fill = klColor(kl(NEXT[i]));
  show(el.cells[i].g);
}

// ---- The loop ----

async function play() {
  build();
  await frame();

  // 1. The rollout: a finished sequence of turns
  show(el.lblA);
  for (const r of el.a) { show(r); await sleep(70); }
  await sleep(1100);

  // 2. The same rollout with a hint in the middle; the turns after it are the same, shifted over
  show(el.lblB);
  el.b.forEach(r => { show(r); move(r, 0, ROW_B - ROW_A); });
  await sleep(800);
  el.b.forEach((r, t) => { if (t >= HINT_AT) move(r, BW + GAP, ROW_B - ROW_A); });
  move(el.hint, 0, -24);
  await sleep(450);
  show(el.hint); move(el.hint, 0, 0);
  await sleep(400);
  show(el.hintText);
  await sleep(2000);

  // 3. One model reads both: the student the plain rollout, the teacher the rollout with the hint.
  //    Training looks only at the turns after the hint, the same fixed tokens in both.
  show(el.lblA, false); show(el.lblB, false); show(el.hintText, false);
  await sleep(300);
  show(el.student); show(el.teacher);
  await sleep(600);
  show(el.outA); show(el.outB);
  await sleep(2600);

  // 4. The target tokens come straight out of the fixed rollout
  [el.student, el.teacher, el.outB, el.hint, ...el.b].forEach(e => show(e, false));
  await sleep(500);
  [...el.a, el.outA].forEach(e => move(e, 0, -30));
  move(el.picked, 0, -30);
  await sleep(500);
  show(el.picked);
  show(el.wedge);
  await sleep(300);
  for (const cell of el.cells) { show(cell.g); await sleep(70); }
  show(el.lblTarget);
  await sleep(1600);

  // Score them one at a time, starting with the first
  [...el.a, el.outA, el.picked, el.wedge].forEach(e => show(e, false));
  show(el.lblTarget, false);
  focusOn(0);
  await sleep(900);

  // The student reads its context and gives its distribution for this token
  show(el.ctx.student);
  await sleep(500);
  const st = chart(0, "student"); await grow(st);
  await sleep(1700);
  // Swap in the teacher's context: the same rollout plus the hint, and its distribution
  show(el.ctx.student, false);
  await sleep(350);
  show(el.ctx.teacher);
  await sleep(500);
  const te = chart(0, "teacher"); await grow(te);
  await sleep(1900);
  show(el.ctx.teacher, false);
  await sleep(300);
  scoreCell(0);
  await sleep(1100);
  drop(st); drop(te);
  await sleep(380);

  // The next tokens, the same way
  for (let i = 1; i < TOKENS.length; i++) {
    const key = i === 2, quick = i > 2;
    focusOn(i);
    await sleep(quick ? 150 : 350);
    const a = chart(i, "student"), b = chart(i, "teacher");
    await grow(a); await grow(b);
    await sleep(key ? 2400 : quick ? 450 : 900);
    scoreCell(i);
    await sleep(key ? 1300 : quick ? 250 : 500);
    drop(a); drop(b);
    await sleep(380);  // the old charts clear before the next ones grow
  }
  focusOn(null);
  await sleep(2200);

  // The payoff: trained on these scores, the model wraps up sooner with no hint
  el.cells.forEach(c => show(c.g, false));
  await sleep(500);
  [...el.a, el.outA].forEach(e => { move(e, 0, 0); });
  el.a.forEach(r => show(r));
  show(el.lblBefore);
  await sleep(500);
  show(el.lblAfter);
  for (const r of el.after) { show(r); await sleep(60); }
  show(el.submitText);
  await sleep(3000);
  [...el.a, ...el.after, el.lblBefore, el.lblAfter, el.submitText].forEach(e => show(e, false));
  await sleep(900);
}

function still() {  // reduced motion: the moment the hint matters
  build();
  el.cells.forEach((c, i) => { show(c.g); if (i < 3) scoreCell(i); });
  el.cells[2].r.style.stroke = css("ink");
  for (const who of ["student", "teacher"]) { const ch = chart(2, who); show(ch.g); ch.bars.forEach(b => { b.style.transform = "none"; }); }
}

if (matchMedia("(prefers-reduced-motion: reduce)").matches) still();
else (async () => { for (;;) await play(); })();
</script>
</body>
</html>
