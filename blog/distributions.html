<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribution options</title>
<style>
:root {
  --bg: #fcfcfb; --ink: #1a1a19; --muted: #6b6a66; --line: #e6e5e1; --turn: #d6d5d0; --fixed: #ecebe7;
  --student: #3d7fd6; --teacher: #e09a2f;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --line: #34342f; --turn: #4a4a46; --fixed: #2a2a28; }
}
:root[data-theme="dark"] { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --line: #34342f; --turn: #4a4a46; --fixed: #2a2a28; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
main { max-width: 720px; margin: 32px auto; padding: 0 16px; }
h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
.note { font-size: 13px; color: var(--muted); margin: 0 0 24px; }
.opt { border-top: 1px solid var(--line); padding: 14px 0 18px; }
.cap { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.cap b { color: var(--ink); margin-right: 6px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
svg text { font-family: var(--mono); }
</style>
</head>
<body>
<main>
  <h1>Mirrored distributions: G4 variations</h1>
  <p class="note">Teacher above the line, student below, the same candidates in the same order. Each at “Let”, where they agree, and “also”, where the hint changes things. Bold is the token in the rollout.</p>
  <div id="opts"></div>
</main>
<script>
const NEXT = {
  Let: [["Let", .80, .62], ["I", .13, .18], ["All", .04, .15]],
  also: [[" also", .48, .07], [" run", .30, .09], [" submit", .02, .42], [" wrap", .03, .36]],
};
const NS = "http://www.w3.org/2000/svg";
const css = v => `var(--${v})`;
function s(tag, attrs = {}, text, parent) {
  const e = document.createElementNS(NS, tag);
  if (tag === "text") attrs = { fill: css("muted"), "font-size": 10, ...attrs };
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  parent.append(e);
  return e;
}

// The main candidates, then a long tail of unnamed tokens: [text, p student, p teacher, is target].
// Ordered by the larger of the two probabilities, or by the teacher's alone.
function distribution(name, slots, order = "max") {
  const main = NEXT[name], target = main[0];
  const key = c => order === "teacher" ? c[2] : Math.max(c[1], c[2]);
  const cands = [...main].sort((a, b) => key(b) - key(a));
  const rest = j => Math.max(1 - cands.reduce((t, c) => t + c[j], 0), 0);
  const n = slots - cands.length, decay = slots > 20 ? 0.86 : 0.7;
  const w = Array.from({ length: n }, (_, k) => decay ** k), W = w.reduce((a, b) => a + b, 0);
  const tail = w.map((v, k) => ["", rest(1) * v / W * (1 + 0.35 * Math.sin(k * 1.7 + 1)), rest(2) * v / W * (1 + 0.35 * Math.sin(k * 2.3)), false]);
  return cands.map(c => [c[0].trim(), c[1], c[2], c === target]).concat(tail);
}

function option(id, caption, draw, h = 170) {
  const div = document.createElement("div");
  div.className = "opt";
  div.innerHTML = `<div class="cap"><b>${id}</b>${caption}</div><div class="pair"></div>`;
  for (const name of ["Let", "also"]) {
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 320 ${h}`);
    draw(svg, name);
    div.querySelector(".pair").append(svg);
  }
  document.getElementById("opts").append(div);
}

// Angled labels under the student's side, only for named tokens
function labels(svg, d, xOf, y) {
  d.forEach((c, k) => {
    if (!c[0]) return;
    const x = xOf(k) + 3;
    s("text", { x, y, "text-anchor": "end", transform: `rotate(-40 ${x} ${y})`,
      ...(c[3] ? { fill: css("ink"), "font-weight": 700 } : {}) }, c[0], svg);
  });
}
const MID = 78, H = 62, X0 = 16, WIDTH = 290;

// Bars: `gap` between slots, as a fraction of the slot
function mirroredBars(svg, d, gap) {
  const slot = WIDTH / d.length, bw = slot * (1 - gap);
  d.forEach((c, k) => {
    const x = X0 + k * slot;
    s("rect", { x, y: MID - 1 - c[2] * H, width: bw, height: c[2] * H, fill: css("teacher") }, null, svg);
    s("rect", { x, y: MID + 1, width: bw, height: c[1] * H, fill: css("student") }, null, svg);
  });
  s("line", { x1: X0 - 4, x2: X0 + WIDTH, y1: MID, y2: MID, stroke: css("turn") }, null, svg);
  labels(svg, d, k => X0 + k * slot + bw / 2, MID + H + 12);
}

// Filled step shapes, or smooth curves through the bar tops
function mirroredShapes(svg, d, smooth) {
  const slot = WIDTH / d.length;
  const pts = j => d.map((c, k) => [X0 + (k + .5) * slot, c[j] * H]);
  const shape = (j, dir) => {
    const p = pts(j), y = h => MID + dir * (1 + h);
    let path;
    if (smooth) {
      path = `M${X0},${y(0)} L${p[0][0] - slot / 2},${y(p[0][1])} L${p[0][0]},${y(p[0][1])}`;
      for (let k = 1; k < p.length; k++) {
        const [x0, h0] = p[k - 1], [x1, h1] = p[k], mx = (x0 + x1) / 2;
        path += ` C${mx},${y(h0)} ${mx},${y(h1)} ${x1},${y(h1)}`;
      }
      path += ` L${X0 + WIDTH},${y(0)} Z`;
    } else {
      path = `M${X0},${y(0)}` + d.map((c, k) => ` L${X0 + k * slot},${y(c[j] * H)} L${X0 + (k + 1) * slot},${y(c[j] * H)}`).join("") + ` L${X0 + WIDTH},${y(0)} Z`;
    }
    return path;
  };
  s("path", { d: shape(2, -1), fill: css("teacher"), opacity: .9 }, null, svg);
  s("path", { d: shape(1, 1), fill: css("student"), opacity: .9 }, null, svg);
  s("line", { x1: X0 - 4, x2: X0 + WIDTH, y1: MID, y2: MID, stroke: css("bg"), "stroke-width": 1.5 }, null, svg);
  labels(svg, d, k => X0 + (k + .5) * slot, MID + H + 12);
}

// More named candidates, then a short tail of unnamed tokens t₉, t₁₀, …, tₙ
const NAMED = {
  Let: [["Let", .80, .62], ["I", .13, .18], ["All", .04, .15], ["Now", .01, .02], ["The", .008, .012], ["OK", .005, .008], ["Good", .003, .004], ["So", .002, .003]],
  also: [[" also", .48, .07], [" run", .30, .09], [" submit", .02, .42], [" wrap", .03, .36], [" check", .08, .02], [" look", .04, .01], [" finish", .005, .02], [" verify", .02, .01]],
};
const SUB = n => String(n).replace(/\d/g, c => "₀₁₂₃₄₅₆₇₈₉"[c]);
function named(name, tailSlots = 6) {
  const cands = [...NAMED[name]].sort((a, b) => b[2] - a[2]), target = NAMED[name][0];
  const rest = j => Math.max(1 - cands.reduce((t, c) => t + c[j], 0), 0);
  const w = Array.from({ length: tailSlots }, (_, k) => 0.7 ** k), W = w.reduce((a, b) => a + b, 0);
  const tail = w.map((v, k) => [k === tailSlots - 1 ? "tₙ" : `t${SUB(cands.length + 1 + k)}`,
    rest(1) * v / W * (1 + 0.3 * Math.sin(k * 1.7 + 1)), rest(2) * v / W * (1 + 0.3 * Math.sin(k * 2.3)), false, true]);
  return cands.map(c => [c[0].trim(), c[1], c[2], c === target, false]).concat(tail);
}

// Bars plus options: a KDE-like smooth shape behind them, a narrower tail, a "…" break before tₙ
function fancy(svg, d, { kde = false, tailWidth = 1, dots = true, H2 = H, barFrac = .88, kdeAlpha = .18 } = {}) {
  const unit = WIDTH / d.reduce((t, c) => t + (c[4] ? tailWidth : 1), 0) * (dots ? 0.94 : 1);
  const xs = []; let x = X0;
  d.forEach((c, k) => {
    if (dots && k === d.length - 1) {  // the break before the last tail token
      for (let i = 0; i < 3; i++) s("circle", { cx: x + 3 + i * 4, cy: MID, r: 1.1, fill: css("muted") }, null, svg);
      x += 15;
    }
    const w = unit * (c[4] ? tailWidth : 1);
    xs.push([x, w]); x += w;
  });
  if (kde) {
    // a smooth curve through the bar tops, drawn soft and behind
    for (const [j, dir, who] of [[2, -1, "teacher"], [1, 1, "student"]]) {
      const p = d.map((c, k) => [xs[k][0] + xs[k][1] / 2, MID + dir * (1 + c[j] * H2 * 1.08)]);
      let path = `M${X0},${MID} L${p[0][0] - xs[0][1] / 2},${p[0][1]} L${p[0][0]},${p[0][1]}`;
      for (let k = 1; k < p.length; k++) { const mx = (p[k - 1][0] + p[k][0]) / 2; path += ` C${mx},${p[k - 1][1]} ${mx},${p[k][1]} ${p[k][0]},${p[k][1]}`; }
      path += ` L${x},${MID} Z`;
      s("path", { d: path, fill: css(who), opacity: kdeAlpha }, null, svg);
      s("path", { d: path.replace(/ L[\d.]+,[\d.]+ Z$/, ""), fill: "none", stroke: css(who), "stroke-width": 1, opacity: .5 }, null, svg);
    }
  }
  d.forEach((c, k) => {
    const [bx, w] = xs[k], bw = w * barFrac, cx = bx + (w - bw) / 2;
    s("rect", { x: cx, y: MID - 1 - c[2] * H2, width: bw, height: c[2] * H2, fill: css("teacher") }, null, svg);
    s("rect", { x: cx, y: MID + 1, width: bw, height: c[1] * H2, fill: css("student") }, null, svg);
  });
  s("line", { x1: X0 - 4, x2: x, y1: MID, y2: MID, stroke: css("turn") }, null, svg);
  d.forEach((c, k) => {
    const lx = xs[k][0] + xs[k][1] * .44 + 3, ly = MID + H2 + 12;
    s("text", { x: lx, y: ly, "text-anchor": "end", transform: `rotate(-40 ${lx} ${ly})`, "font-size": c[4] ? 9 : 10,
      ...(c[3] ? { fill: css("ink"), "font-weight": 700 } : {}), ...(c[4] ? { "font-style": "italic" } : {}) }, c[0], svg);
  });
}


// Compact versions: the chart ends where the probability does
function compact(svg, name, { other = false, tail = 3, sqrt = false, fade = false, W2 = 190 } = {}) {
  const top = [...NAMED[name]].sort((a, b) => b[2] - a[2]).slice(0, 6), target = NAMED[name][0];
  const rest = j => Math.max(1 - top.reduce((t, c) => t + c[j], 0), 0);
  let d = top.map(c => [c[0].trim(), c[1], c[2], c === target, false]);
  if (other) d.push(["other", rest(1), rest(2), false, true]);
  else {
    const w = Array.from({ length: tail }, (_, k) => 0.55 ** (k + 1)), Wt = w.reduce((a, b) => a + b, 0) / 0.6;
    d = d.concat(w.map((v, k) => ["", rest(1) * v / Wt, rest(2) * v / Wt * (1 + .25 * Math.sin(k * 2)), false, true]));
  }
  const hgt = p => (sqrt ? Math.sqrt(p) : p) * H;
  const x0 = X0 + (WIDTH - W2) / 2, unit = W2 / d.reduce((t, c) => t + (c[4] && !other ? .6 : 1), 0);
  const xs = []; let x = x0;
  d.forEach(c => { const w = unit * (c[4] && !other ? .6 : 1); xs.push([x, w]); x += w; });
  const end = x;
  const id = `fade${Math.random().toString(36).slice(2)}`;
  if (fade) {
    const grad = s("linearGradient", { id, x1: 0, x2: 1, y1: 0, y2: 0 }, null, s("defs", {}, null, svg));
    s("stop", { offset: .75, "stop-color": "#fff", "stop-opacity": 1 }, null, grad);
    s("stop", { offset: 1, "stop-color": "#fff", "stop-opacity": 0 }, null, grad);
    const m = s("mask", { id: id + "m" }, null, svg.querySelector("defs"));
    s("rect", { x: x0 - 4, y: 0, width: end - x0 + 30, height: 200, fill: `url(#${id})` }, null, m);
  }
  const g = s("g", fade ? { mask: `url(#${id}m)` } : {}, null, svg);
  for (const [j, dir, who] of [[2, -1, "teacher"], [1, 1, "student"]]) {
    const p = d.map((c, k) => [xs[k][0] + xs[k][1] / 2, MID + dir * (1 + hgt(c[j]) * 1.06)]);
    let path = `M${x0},${MID} L${x0},${p[0][1]} L${p[0][0]},${p[0][1]}`;
    for (let k = 1; k < p.length; k++) { const mx = (p[k - 1][0] + p[k][0]) / 2; path += ` C${mx},${p[k - 1][1]} ${mx},${p[k][1]} ${p[k][0]},${p[k][1]}`; }
    const tailEnd = fade ? end + 24 : end;
    path += ` C${tailEnd - 6},${p[p.length - 1][1]} ${tailEnd - 6},${MID} ${tailEnd},${MID} Z`;
    s("path", { d: path, fill: css(who), opacity: .28 }, null, g);
  }
  d.forEach((c, k) => {
    const [bx, w] = xs[k], bw = w * .4, cx = bx + (w - bw) / 2;
    s("rect", { x: cx, y: MID - 1 - hgt(c[2]), width: bw, height: hgt(c[2]), fill: css("teacher") }, null, g);
    s("rect", { x: cx, y: MID + 1, width: bw, height: hgt(c[1]), fill: css("student") }, null, g);
  });
  s("line", { x1: x0 - 4, x2: fade ? end + 24 : end, y1: MID, y2: MID, stroke: css("turn") }, null, svg);
  if (!other && !fade) for (let i = 0; i < 3; i++) s("circle", { cx: end + 6 + i * 4, cy: MID, r: 1.1, fill: css("muted") }, null, svg);
  d.forEach((c, k) => {
    if (!c[0]) return;
    const lx = xs[k][0] + xs[k][1] / 2 + 3, ly = MID + H + 12;
    s("text", { x: lx, y: ly, "text-anchor": "end", transform: `rotate(-40 ${lx} ${ly})`,
      ...(c[3] ? { fill: css("ink"), "font-weight": 700 } : {}), ...(c[4] ? { "font-style": "italic" } : {}) }, c[0], svg);
  });
}


// G4 variations: square-root heights, a Gaussian KDE over the bars, and optionally no token names
function g4(svg, name, { slots = 9, labels = true, gap = .6, sigma = .9, W2 = 190 } = {}) {
  const top = [...NAMED[name]].sort((a, b) => b[2] - a[2]), target = NAMED[name][0];
  const named = top.slice(0, Math.min(slots, 8));
  const rest = j => Math.max(1 - named.reduce((t, c) => t + c[j], 0), 0);
  const n = slots - named.length;
  const w = Array.from({ length: n }, (_, k) => 0.8 ** (k + 1)), Wt = w.reduce((a, b) => a + b, 0);
  const d = named.map(c => [c[0].trim(), c[1], c[2], c === target])
    .concat(w.map((v, k) => ["", rest(1) * v / Wt * (1 + .3 * Math.sin(k * 1.3 + 1)), rest(2) * v / Wt * (1 + .3 * Math.sin(k * 1.9)), false]));
  const hgt = p => Math.sqrt(p) * H;
  const x0 = X0 + (WIDTH - W2) / 2, slot = W2 / d.length, cx = k => x0 + (k + .5) * slot;
  // KDE: a Gaussian bump under each bar, scaled so the curve sits just over the bars
  const kde = j => {
    const pts = [];
    for (let x = x0 - slot; x <= x0 + W2 + slot * 1.5; x += 1) {
      const v = d.reduce((t, c, k) => t + hgt(c[j]) * Math.exp(-((x - cx(k)) ** 2) / (2 * (sigma * slot) ** 2)), 0);
      pts.push([x, v]);
    }
    const peak = Math.max(...pts.map(p => p[1])), top = Math.max(...d.map(c => hgt(c[j])));
    return pts.map(([x, v]) => [x, v / peak * top * 1.08]);
  };
  for (const [j, dir, who] of [[2, -1, "teacher"], [1, 1, "student"]]) {
    const pts = kde(j);
    const path = `M${pts[0][0]},${MID} ` + pts.map(([x, v]) => `L${x.toFixed(1)},${(MID + dir * (1 + v)).toFixed(1)}`).join(" ") + ` L${pts[pts.length - 1][0]},${MID} Z`;
    s("path", { d: path, fill: css(who), opacity: .25 }, null, svg);
  }
  d.forEach((c, k) => {
    const bw = slot * (1 - gap), x = cx(k) - bw / 2;
    s("rect", { x, y: MID - 1 - hgt(c[2]), width: bw, height: hgt(c[2]), fill: css("teacher") }, null, svg);
    s("rect", { x, y: MID + 1, width: bw, height: hgt(c[1]), fill: css("student") }, null, svg);
  });
  s("line", { x1: x0 - slot, x2: x0 + W2 + slot * 1.5, y1: MID, y2: MID, stroke: css("turn") }, null, svg);
  const tk = d.findIndex(c => c[3]);
  if (labels) {
    d.forEach((c, k) => {
      if (!c[0]) return;
      const lx = cx(k) + 3, ly = MID + H + 12;
      s("text", { x: lx, y: ly, "text-anchor": "end", transform: `rotate(-40 ${lx} ${ly})`, ...(c[3] ? { fill: css("ink"), "font-weight": 700 } : {}) }, c[0], svg);
    });
  } else {
    // no names: just mark the token in the rollout
    s("path", { d: `M${cx(tk) - 4},${MID + H + 10} L${cx(tk) + 4},${MID + H + 10} L${cx(tk)},${MID + H + 4} Z`, fill: css("ink") }, null, svg);
  }
}

option("G4", "For reference: square-root heights, curve through the bar tops.", (svg, name) => compact(svg, name, { sqrt: true }));
option("G4a", "A smooth Gaussian KDE behind the bars, still with token names.", (svg, name) => g4(svg, name));
option("G4b", "No token names: 30 bars packed close, the token in the rollout marked underneath.", (svg, name) => g4(svg, name, { slots: 30, labels: false, gap: .35, sigma: 1.6 }));
option("G4c", "Like G4b, bars touching, so it reads as one shape.", (svg, name) => g4(svg, name, { slots: 30, labels: false, gap: .06, sigma: 1.6 }));
</script>
</body>
</html>
