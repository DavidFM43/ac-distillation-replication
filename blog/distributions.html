<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribution options</title>
<style>
:root {
  --bg: #fcfcfb; --ink: #1a1a19; --muted: #6b6a66; --line: #e6e5e1; --turn: #d6d5d0; --fixed: #ecebe7;
  --student: #3d7fd6; --teacher: #e09a2f;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --line: #34342f; --turn: #4a4a46; --fixed: #2a2a28; }
}
:root[data-theme="dark"] { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --line: #34342f; --turn: #4a4a46; --fixed: #2a2a28; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
main { max-width: 720px; margin: 32px auto; padding: 0 16px; }
h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
.note { font-size: 13px; color: var(--muted); margin: 0 0 24px; }
.opt { border-top: 1px solid var(--line); padding: 14px 0 18px; }
.cap { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.cap b { color: var(--ink); margin-right: 6px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
svg text { font-family: var(--mono); }
</style>
</head>
<body>
<main>
  <h1>Mirrored distributions: variations</h1>
  <p class="note">Teacher above the line, student below, the same candidates in the same order. Each at “Let”, where they agree, and “also”, where the hint changes things. Bold is the token in the rollout.</p>
  <div id="opts"></div>
</main>
<script>
const NEXT = {
  Let: [["Let", .80, .62], ["I", .13, .18], ["All", .04, .15]],
  also: [[" also", .48, .07], [" run", .30, .09], [" submit", .02, .42], [" wrap", .03, .36]],
};
const NS = "http://www.w3.org/2000/svg";
const css = v => `var(--${v})`;
function s(tag, attrs = {}, text, parent) {
  const e = document.createElementNS(NS, tag);
  if (tag === "text") attrs = { fill: css("muted"), "font-size": 10, ...attrs };
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  parent.append(e);
  return e;
}

// The main candidates, then a long tail of unnamed tokens: [text, p student, p teacher, is target].
// Ordered by the larger of the two probabilities, or by the teacher's alone.
function distribution(name, slots, order = "max") {
  const main = NEXT[name], target = main[0];
  const key = c => order === "teacher" ? c[2] : Math.max(c[1], c[2]);
  const cands = [...main].sort((a, b) => key(b) - key(a));
  const rest = j => Math.max(1 - cands.reduce((t, c) => t + c[j], 0), 0);
  const n = slots - cands.length, decay = slots > 20 ? 0.86 : 0.7;
  const w = Array.from({ length: n }, (_, k) => decay ** k), W = w.reduce((a, b) => a + b, 0);
  const tail = w.map((v, k) => ["", rest(1) * v / W * (1 + 0.35 * Math.sin(k * 1.7 + 1)), rest(2) * v / W * (1 + 0.35 * Math.sin(k * 2.3)), false]);
  return cands.map(c => [c[0].trim(), c[1], c[2], c === target]).concat(tail);
}

function option(id, caption, draw, h = 170) {
  const div = document.createElement("div");
  div.className = "opt";
  div.innerHTML = `<div class="cap"><b>${id}</b>${caption}</div><div class="pair"></div>`;
  for (const name of ["Let", "also"]) {
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 320 ${h}`);
    draw(svg, name);
    div.querySelector(".pair").append(svg);
  }
  document.getElementById("opts").append(div);
}

// Angled labels under the student's side, only for named tokens
function labels(svg, d, xOf, y) {
  d.forEach((c, k) => {
    if (!c[0]) return;
    const x = xOf(k) + 3;
    s("text", { x, y, "text-anchor": "end", transform: `rotate(-40 ${x} ${y})`,
      ...(c[3] ? { fill: css("ink"), "font-weight": 700 } : {}) }, c[0], svg);
  });
}
const MID = 78, H = 62, X0 = 16, WIDTH = 290;

// Bars: `gap` between slots, as a fraction of the slot
function mirroredBars(svg, d, gap) {
  const slot = WIDTH / d.length, bw = slot * (1 - gap);
  d.forEach((c, k) => {
    const x = X0 + k * slot;
    s("rect", { x, y: MID - 1 - c[2] * H, width: bw, height: c[2] * H, fill: css("teacher") }, null, svg);
    s("rect", { x, y: MID + 1, width: bw, height: c[1] * H, fill: css("student") }, null, svg);
  });
  s("line", { x1: X0 - 4, x2: X0 + WIDTH, y1: MID, y2: MID, stroke: css("turn") }, null, svg);
  labels(svg, d, k => X0 + k * slot + bw / 2, MID + H + 12);
}

// Filled step shapes, or smooth curves through the bar tops
function mirroredShapes(svg, d, smooth) {
  const slot = WIDTH / d.length;
  const pts = j => d.map((c, k) => [X0 + (k + .5) * slot, c[j] * H]);
  const shape = (j, dir) => {
    const p = pts(j), y = h => MID + dir * (1 + h);
    let path;
    if (smooth) {
      path = `M${X0},${y(0)} L${p[0][0] - slot / 2},${y(p[0][1])} L${p[0][0]},${y(p[0][1])}`;
      for (let k = 1; k < p.length; k++) {
        const [x0, h0] = p[k - 1], [x1, h1] = p[k], mx = (x0 + x1) / 2;
        path += ` C${mx},${y(h0)} ${mx},${y(h1)} ${x1},${y(h1)}`;
      }
      path += ` L${X0 + WIDTH},${y(0)} Z`;
    } else {
      path = `M${X0},${y(0)}` + d.map((c, k) => ` L${X0 + k * slot},${y(c[j] * H)} L${X0 + (k + 1) * slot},${y(c[j] * H)}`).join("") + ` L${X0 + WIDTH},${y(0)} Z`;
    }
    return path;
  };
  s("path", { d: shape(2, -1), fill: css("teacher"), opacity: .9 }, null, svg);
  s("path", { d: shape(1, 1), fill: css("student"), opacity: .9 }, null, svg);
  s("line", { x1: X0 - 4, x2: X0 + WIDTH, y1: MID, y2: MID, stroke: css("bg"), "stroke-width": 1.5 }, null, svg);
  labels(svg, d, k => X0 + (k + .5) * slot, MID + H + 12);
}

option("B1", "The current version: 12 candidates, wide gaps.", (svg, name) => mirroredBars(svg, distribution(name, 12), .36));
option("B2", "Histogram: 20 candidates, bars touching, a longer tail.", (svg, name) => mirroredBars(svg, distribution(name, 20), .08));
option("B3", "Dense: 40 thin bars with hairline gaps; only the main tokens named.", (svg, name) => mirroredBars(svg, distribution(name, 40), .22));
option("B4", "Filled step shapes: each model's distribution as one silhouette.", (svg, name) => mirroredShapes(svg, distribution(name, 24), false));
option("B5", "Smooth shapes, like density curves (tokens are discrete, so this one bends the truth a little).", (svg, name) => mirroredShapes(svg, distribution(name, 24), true));
option("B6", "Like B2, but ordered by the teacher's probability: the teacher's side always falls off smoothly, and the student's bumps are where they disagree.",
  (svg, name) => mirroredBars(svg, distribution(name, 20, "teacher"), .08));
</script>
</body>
</html>
