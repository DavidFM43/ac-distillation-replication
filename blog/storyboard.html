<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure storyboard</title>
<style>
:root {
  --bg: #fcfcfb; --ink: #1a1a19; --muted: #6b6a66; --faint: #b4b3ae; --line: #e6e5e1;
  --turn: #d6d5d0; --fixed: #ecebe7; --task: #3b3b38; --student: #3d7fd6; --teacher: #e09a2f; --hint: #e09a2f;
  --bad: #e0574c; --good: #5fae78;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --faint: #5a5955; --line: #34342f; --turn: #4a4a46; --fixed: #2a2a28; --task: #c9c8c3; }
}
:root[data-theme="dark"] { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --faint: #5a5955; --line: #34342f; --turn: #4a4a46; --fixed: #2a2a28; --task: #c9c8c3; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
main { max-width: 680px; margin: 32px auto; padding: 0 16px; }
h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
h2 { font-size: 13px; font-weight: 600; margin: 36px 0 0; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.note { font-size: 13px; color: var(--muted); margin: 0 0 28px; }
.frame { border-top: 1px solid var(--line); padding: 16px 0 26px; }
.cap { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.cap b { color: var(--ink); font-weight: 600; margin-right: 6px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
svg text { font-family: var(--mono); }
</style>
</head>
<body>
<main>
  <h1>Headline figure: storyboard</h1>
  <p class="note">Static frames, before any animation. The captions are notes for us, not part of the figure.</p>
  <div id="frames"></div>
</main>
<script>
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs = {}, text) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
};
const css = v => `var(--${v})`;
const T = (svg, x, y, text, attrs = {}) => svg.append(s("text", { x, y, "font-size": 11, fill: css("muted"), ...attrs }, text));

function heading(text) {
  const h = document.createElement("h2");
  h.textContent = text;
  document.getElementById("frames").append(h);
}

function frame(n, caption, w, h, draw) {
  const f = document.createElement("div");
  f.className = "frame";
  f.innerHTML = `<div class="cap"><b>${n}</b>${caption}</div>`;
  const svg = s("svg", { viewBox: `0 0 ${w} ${h}` });
  draw(svg);
  f.append(svg);
  document.getElementById("frames").append(f);
}

const HINT = "You're taking too long. Wrap up.";

// ---- Frames 1–3: the rollout as a row of turn blocks ----

const N_TURNS = 16, HINT_AT = 8;  // the hint goes before the 8th turn shown
const BW = 22, BH = 30, GAP = 5, X0 = 106;

// Returns the x of each turn block; with `hint`, the hint block sits before turn HINT_AT
function row(svg, y, { hint = false, end = N_TURNS, submitLast = false } = {}) {
  let x = X0;
  const xs = [];
  svg.append(s("rect", { x, y, width: BW, height: BH, rx: 4, fill: css("task") }));
  x += BW + GAP;
  let hintX = null;
  for (let t = 1; t <= end; t++) {
    if (hint && t === HINT_AT) {
      svg.append(s("rect", { x, y, width: BW, height: BH, rx: 4, fill: css("hint") }));
      hintX = x;
      x += BW + GAP;
    }
    const last = submitLast && t === end;
    svg.append(s("rect", { x, y, width: BW, height: BH, rx: 4, fill: css("turn"),
      ...(last ? { stroke: css("good"), "stroke-width": 2 } : {}) }));
    xs[t] = x;
    x += BW + GAP;
  }
  return { xs, hintX };
}

// An outline around the turns after the hint: the fixed tokens that get supervised
function outlineFixed(svg, xs, y) {
  const x0 = xs[HINT_AT] - 4, x1 = xs[N_TURNS] + BW + 4;
  svg.append(s("rect", { x: x0, y: y - 4, width: x1 - x0, height: BH + 8, rx: 7, fill: "none", stroke: css("ink"), "stroke-width": 1.2, "stroke-dasharray": "3 3" }));
}

frame(1, "The model's rollout on a task: a finished sequence of turns. From here on it's fixed data.", 600, 50, svg => {
  row(svg, 8);
  T(svg, 0, 28, "rollout");
});

frame(2, "Write a hint into the middle of that same rollout. Nothing else changes: the turns after it are the same tokens.", 600, 130, svg => {
  row(svg, 8);
  T(svg, 0, 28, "rollout");
  const { hintX } = row(svg, 62, { hint: true });
  T(svg, 0, 82, "rollout + hint");
  T(svg, hintX + BW / 2, 118, `“${HINT}”`, { "text-anchor": "middle", fill: css("teacher") });
});

frame(3, "One model reads both. Reading the plain rollout, it's the student; reading it with the hint, it's the teacher. Training only looks at the turns after the hint (outlined): the same fixed tokens in both.", 600, 120, svg => {
  const a = row(svg, 12);
  svg.append(s("circle", { cx: 6, cy: 25, r: 4, fill: css("student") }));
  T(svg, 16, 29, "student", { fill: css("student") });
  T(svg, 16, 42, "the model", { "font-size": 9.5 });
  outlineFixed(svg, a.xs, 12);
  const b = row(svg, 72, { hint: true });
  svg.append(s("circle", { cx: 6, cy: 85, r: 4, fill: css("teacher") }));
  T(svg, 16, 89, "teacher", { fill: css("teacher") });
  T(svg, 16, 102, "same model", { "font-size": 9.5 });
  outlineFixed(svg, b.xs, 72);
});

// ---- Frames 4–6: one turn after the hint, token by token ----

// The fixed tokens of that turn and, at each, what each model would put there:
// [token, p student (no hint), p teacher (with hint)]; the token in the rollout is first
const TOKENS = ["Let", " me", " also", " run", " the", " tests", "."];
const NEXT = [
  [["Let", .80, .62], ["I", .13, .18], ["All", .04, .15]],
  [[" me", .97, .96], [" us", .02, .03]],
  [[" also", .48, .07], [" run", .30, .09], [" submit", .02, .42], [" wrap", .03, .36]],
  [[" run", .62, .55], [" check", .25, .30], [" look", .08, .06]],
  [[" the", .86, .80], [" all", .10, .13]],
  [[" tests", .95, .94], [" suite", .03, .04]],
  [[".", .62, .38], [" and", .05, .32], [" too", .25, .22]],
];
const KEY = 2;  // the token where the hint matters

// KL(teacher ‖ student) over the candidates and the rest of the vocabulary
function kl(cands, studentSide = 1) {
  const rest = j => Math.max(1 - cands.reduce((t, c) => t + c[j], 0), 1e-3);
  return cands.map(c => [c[studentSide], c[2]]).concat([[rest(studentSide), rest(2)]]).reduce((t, [a, b]) => t + b * Math.log(b / a), 0);
}
const mix = k => {
  const x = Math.min(Math.max(k, 0) / 1.2, 1), g = [95, 174, 120], r = [224, 87, 76];
  return `rgb(${g.map((v, i) => Math.round(v + (r[i] - v) * x)).join(" ")})`;
};

// Step 4: the target tokens, scored one at a time.
// At the token in focus: the teacher's distribution over what goes there (above) and the student's (below),
// over the same candidates in the same order; the bold label is the target token itself.
const ROW_Y = 92, CELL_H = 24;

function targetRow(svg, { focus = null, scored = 0 } = {}) {
  const cells = [];
  let x = 150;
  TOKENS.forEach((t, i) => {
    const w = Math.max(t.trim().length * 8 + 16, 32);
    const done = i < scored, dim = focus !== null && i !== focus && !done;
    svg.append(s("rect", { x, y: ROW_Y, width: w, height: CELL_H, rx: 4,
      fill: done ? mix(kl(NEXT[i])) : css("fixed"), stroke: i === focus ? css("ink") : css("turn"),
      "stroke-width": i === focus ? 1.5 : 1, opacity: dim ? .35 : 1 }));
    T(svg, x + w / 2, ROW_Y + 16, t.trim(), { "text-anchor": "middle", fill: css("ink"), "font-size": 12, opacity: dim ? .35 : 1 });
    cells.push({ x, w, c: x + w / 2 });
    x += w + 8;
  });
  return cells;
}

function chart(svg, cell, i, who) {
  const above = who === "teacher", side = above ? 2 : 1, color = css(who);
  const cands = NEXT[i], bw = 22, gap = 12, H = 50;
  const x0 = cell.c - (cands.length * (bw + gap) - gap) / 2;
  const base = above ? ROW_Y - 22 : ROW_Y + CELL_H + 22;
  cands.forEach((cand, k) => {
    const hgt = Math.max(2, cand[side] * H), x = x0 + k * (bw + gap);
    svg.append(s("rect", { x, y: above ? base - hgt : base, width: bw, height: hgt, rx: 2, fill: color }));
    T(svg, x + bw / 2, above ? base + 11 : base - 4, cand[0].trim(), { "text-anchor": "middle", "font-size": 9.5,
      ...(k === 0 ? { fill: css("ink"), "font-weight": 700 } : {}) });  // the target token's label in bold
  });
  svg.append(s("line", { x1: x0 - 6, x2: x0 + cands.length * (bw + gap) - gap + 6, y1: base, y2: base, stroke: css("turn") }));
  // who is reading, and with what context
  const ly = above ? base - H / 2 : base + H / 2;
  svg.append(s("rect", { x: 0, y: ly - 8, width: 34, height: 16, rx: 3, fill: css("turn") }));
  if (above) svg.append(s("rect", { x: 27, y: ly - 8, width: 7, height: 16, rx: 2, fill: css("hint") }));
  T(svg, 42, ly + 4, who, { fill: color });
}

function step4(svg, { focus = null, show = [], scored = 0 } = {}) {
  const cells = targetRow(svg, { focus, scored });
  T(svg, 0, ROW_Y + 16, "target");
  for (const who of show) chart(svg, cells[focus], focus, who);
}

frame("4.1", "The target: the fixed tokens of the turns after the hint (one turn shown).", 600, 190, svg => step4(svg));
frame("4.2", "Focus on the first token; the rest wait.", 600, 190, svg => step4(svg, { focus: 0 }));
frame("4.3", "The teacher (with the hint): how likely is each token here?", 600, 190, svg => step4(svg, { focus: 0, show: ["teacher"] }));
frame("4.4", "The student (no hint), on the same token.", 600, 190, svg => step4(svg, { focus: 0, show: ["teacher", "student"] }));
frame("4.5", "Compare the two (KL): nearly the same, so green.", 600, 190, svg => step4(svg, { focus: 0, show: ["teacher", "student"], scored: 1 }));
frame("4.6", "Next token, same thing.", 600, 190, svg => step4(svg, { focus: 1, show: ["teacher", "student"], scored: 2 }));
frame("4.7", "Here the hint matters: the teacher would rather submit or wrap up, the student goes on. Red.", 600, 190, svg => step4(svg, { focus: 2, show: ["teacher", "student"], scored: 3 }));
frame("4.8", "Every target token gets a score. Training lowers them, pulling the student toward the teacher.", 600, 190, svg => step4(svg, { scored: TOKENS.length }));

heading("Then");

frame(7, "The payoff: the trained model, given no hint, wraps up and submits sooner.", 600, 100, svg => {
  row(svg, 8);
  T(svg, 0, 28, "before");
  row(svg, 58, { end: 10, submitLast: true });
  T(svg, 0, 78, "after training");
});
</script>
</body>
</html>
