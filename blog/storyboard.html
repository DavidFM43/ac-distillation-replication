<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure storyboard</title>
<style>
:root {
  --bg: #fcfcfb; --ink: #1a1a19; --muted: #6b6a66; --faint: #b4b3ae; --line: #e6e5e1;
  --turn: #d6d5d0; --fixed: #ecebe7; --task: #3b3b38; --student: #3d7fd6; --teacher: #e09a2f; --hint: #e09a2f;
  --bad: #e0574c; --good: #5fae78;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --faint: #5a5955; --line: #34342f; --turn: #4a4a46; --fixed: #2a2a28; --task: #c9c8c3; }
}
:root[data-theme="dark"] { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --faint: #5a5955; --line: #34342f; --turn: #4a4a46; --fixed: #2a2a28; --task: #c9c8c3; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
main { max-width: 680px; margin: 32px auto; padding: 0 16px; }
h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
h2 { font-size: 13px; font-weight: 600; margin: 36px 0 0; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.note { font-size: 13px; color: var(--muted); margin: 0 0 28px; }
.frame { border-top: 1px solid var(--line); padding: 16px 0 26px; }
.cap { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.cap b { color: var(--ink); font-weight: 600; margin-right: 6px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
svg text { font-family: var(--mono); }
</style>
</head>
<body>
<main>
  <h1>Headline figure: storyboard</h1>
  <p class="note">Static frames, before any animation. The captions are notes for us, not part of the figure. Frames 4–6 come in two versions to choose from.</p>
  <div id="frames"></div>
</main>
<script>
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs = {}, text) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
};
const css = v => `var(--${v})`;
const T = (svg, x, y, text, attrs = {}) => svg.append(s("text", { x, y, "font-size": 11, fill: css("muted"), ...attrs }, text));

function heading(text) {
  const h = document.createElement("h2");
  h.textContent = text;
  document.getElementById("frames").append(h);
}

function frame(n, caption, w, h, draw) {
  const f = document.createElement("div");
  f.className = "frame";
  f.innerHTML = `<div class="cap"><b>${n}</b>${caption}</div>`;
  const svg = s("svg", { viewBox: `0 0 ${w} ${h}` });
  draw(svg);
  f.append(svg);
  document.getElementById("frames").append(f);
}

const HINT = "You're taking too long. Wrap up.";

// ---- Frames 1–3: the rollout as a row of turn blocks ----

const N_TURNS = 16, HINT_AT = 8;  // the hint goes before the 8th turn shown
const BW = 22, BH = 30, GAP = 5, X0 = 106;

// Returns the x of each turn block; with `hint`, the hint block sits before turn HINT_AT
function row(svg, y, { hint = false, end = N_TURNS, submitLast = false } = {}) {
  let x = X0;
  const xs = [];
  svg.append(s("rect", { x, y, width: BW, height: BH, rx: 4, fill: css("task") }));
  x += BW + GAP;
  let hintX = null;
  for (let t = 1; t <= end; t++) {
    if (hint && t === HINT_AT) {
      svg.append(s("rect", { x, y, width: BW, height: BH, rx: 4, fill: css("hint") }));
      hintX = x;
      x += BW + GAP;
    }
    const last = submitLast && t === end;
    svg.append(s("rect", { x, y, width: BW, height: BH, rx: 4, fill: css("turn"),
      ...(last ? { stroke: css("good"), "stroke-width": 2 } : {}) }));
    xs[t] = x;
    x += BW + GAP;
  }
  return { xs, hintX };
}

// An outline around the turns after the hint: the fixed tokens that get supervised
function outlineFixed(svg, xs, y) {
  const x0 = xs[HINT_AT] - 4, x1 = xs[N_TURNS] + BW + 4;
  svg.append(s("rect", { x: x0, y: y - 4, width: x1 - x0, height: BH + 8, rx: 7, fill: "none", stroke: css("ink"), "stroke-width": 1.2, "stroke-dasharray": "3 3" }));
}

frame(1, "The model's rollout on a task: a finished sequence of turns. From here on it's fixed data.", 600, 50, svg => {
  row(svg, 8);
  T(svg, 0, 28, "rollout");
});

frame(2, "Write a hint into the middle of that same rollout. Nothing else changes: the turns after it are the same tokens.", 600, 130, svg => {
  row(svg, 8);
  T(svg, 0, 28, "rollout");
  const { hintX } = row(svg, 62, { hint: true });
  T(svg, 0, 82, "rollout + hint");
  T(svg, hintX + BW / 2, 118, `“${HINT}”`, { "text-anchor": "middle", fill: css("teacher") });
});

frame(3, "One model reads both. Reading the plain rollout, it's the student; reading it with the hint, it's the teacher. Training only looks at the turns after the hint (outlined): the same fixed tokens in both.", 600, 120, svg => {
  const a = row(svg, 12);
  svg.append(s("circle", { cx: 6, cy: 25, r: 4, fill: css("student") }));
  T(svg, 16, 29, "student", { fill: css("student") });
  T(svg, 16, 42, "the model", { "font-size": 9.5 });
  outlineFixed(svg, a.xs, 12);
  const b = row(svg, 72, { hint: true });
  svg.append(s("circle", { cx: 6, cy: 85, r: 4, fill: css("teacher") }));
  T(svg, 16, 89, "teacher", { fill: css("teacher") });
  T(svg, 16, 102, "same model", { "font-size": 9.5 });
  outlineFixed(svg, b.xs, 72);
});

// ---- Frames 4–6: one turn after the hint, token by token ----

// The fixed tokens of that turn and, at each, what each model would put there:
// [token, p student (no hint), p teacher (with hint)]; the token in the rollout is first
const TOKENS = ["Let", " me", " also", " run", " the", " tests", "."];
const NEXT = [
  [["Let", .80, .62], ["I", .13, .18], ["All", .04, .15]],
  [[" me", .97, .96], [" us", .02, .03]],
  [[" also", .48, .07], [" run", .30, .09], [" submit", .02, .42], [" wrap", .03, .36]],
  [[" run", .62, .55], [" check", .25, .30], [" look", .08, .06]],
  [[" the", .86, .80], [" all", .10, .13]],
  [[" tests", .95, .94], [" suite", .03, .04]],
  [[".", .62, .38], [" and", .05, .32], [" too", .25, .22]],
];
const KEY = 2;  // the token where the hint matters

// KL(teacher ‖ student) over the candidates and the rest of the vocabulary
function kl(cands, studentSide = 1) {
  const rest = j => Math.max(1 - cands.reduce((t, c) => t + c[j], 0), 1e-3);
  return cands.map(c => [c[studentSide], c[2]]).concat([[rest(studentSide), rest(2)]]).reduce((t, [a, b]) => t + b * Math.log(b / a), 0);
}
const mix = k => {
  const x = Math.min(Math.max(k, 0) / 1.2, 1), g = [95, 174, 120], r = [224, 87, 76];
  return `rgb(${g.map((v, i) => Math.round(v + (r[i] - v) * x)).join(" ")})`;
};

function tokenCells(svg, y, x0) {
  const cells = [];
  let x = x0;
  for (const t of TOKENS) {
    const w = Math.max(t.trim().length * 7.4 + 14, 30);
    svg.append(s("rect", { x, y, width: w, height: 22, rx: 4, fill: css("fixed"), stroke: css("turn") }));
    T(svg, x + w / 2, y + 15, t.trim(), { "text-anchor": "middle", fill: css("ink"), "font-size": 11.5 });
    cells.push({ x, w, c: x + w / 2 });
    x += w + 12;
  }
  return cells;
}

// Version A: by each token, a small bar chart of what the model would put there
// (the same candidates in the same order for both models; the solid bar is the token in the rollout)
function bars(svg, cell, i, base, dir, side, color) {
  const cands = NEXT[i], bw = 6, gap = 2, H = 30;
  const x0 = cell.c - (cands.length * (bw + gap) - gap) / 2;
  cands.forEach((cand, k) => {
    const h = Math.max(1.5, cand[side] * H), x = x0 + k * (bw + gap);
    svg.append(s("rect", { x, y: dir < 0 ? base - h : base, width: bw, height: h, rx: 1, fill: color, opacity: k === 0 ? 1 : .5 }));
  });
  if (i === KEY) {
    const top = [...cands].sort((a, b) => b[side] - a[side])[0];
    T(svg, cell.c, dir < 0 ? base - H - 6 : base + H + 13, `${top[0].trim()} ${Math.round(top[side] * 100)}%`,
      { "text-anchor": "middle", "font-size": 10, fill: color });
  }
}

function versionA(svg, { score = false, trained = false } = {}) {
  const sy = 60, ty = 96;  // the two token rows
  // Each row continues its own context: the rollout so far, and for the teacher the hint
  svg.append(s("rect", { x: 44, y: sy, width: 46, height: 22, rx: 4, fill: css("turn") }));
  svg.append(s("rect", { x: 44, y: ty, width: 46, height: 22, rx: 4, fill: css("turn") }));
  svg.append(s("rect", { x: 80, y: ty, width: 10, height: 22, rx: 2, fill: css("hint") }));
  T(svg, 0, sy + 15, "student", { fill: css("student") });
  T(svg, 0, ty + 15, "teacher", { fill: css("teacher") });
  const a = tokenCells(svg, sy, 104), b = tokenCells(svg, ty, 104);
  a.forEach((cell, i) => bars(svg, cell, i, sy - 4, -1, trained ? 2 : 1, css("student")));
  b.forEach((cell, i) => bars(svg, cell, i, ty + 26, 1, 2, css("teacher")));
  if (score) {
    a.forEach((cell, i) => svg.append(s("circle", { cx: cell.c, cy: (sy + 22 + ty) / 2, r: 4.5,
      fill: mix(kl(NEXT[i], trained ? 2 : 1)) })));
  }
}

heading("Version A: a small bar chart per token");

frame("4A", "Zoom into one turn after the hint. Both models read the same fixed tokens. At each one, a small chart of what the model would put there. They agree almost everywhere, except at “also”: the teacher would rather submit.", 600, 160, svg => versionA(svg));

frame("5A", "Compare the two charts at each token (KL). Green: the hint changes nothing. Red: it changes what the model would do.", 600, 160, svg => versionA(svg, { score: true }));

frame("6A", "Training pulls the student's charts toward the teacher's. The red goes away: the student now leans toward wrapping up, without the hint.", 600, 160, svg => versionA(svg, { score: true, trained: true }));

// Version B: each model's tree of continuations, laid out the same way for both.
// The fixed rollout is the gray path through it; branch thickness is the model's probability.
const W = p => 1 + p * 9;
function tree(svg, y, side, color, label, hint) {
  const dx = 66, x0 = 110;
  const px = i => x0 + i * dx;
  // the fixed rollout, as a gray band under its path
  svg.append(s("line", { x1: px(0), x2: px(TOKENS.length), y1: y, y2: y, stroke: css("fixed"), "stroke-width": 16, "stroke-linecap": "round" }));
  svg.append(s("rect", { x: px(0) - 52, y: y - 9, width: 40, height: 18, rx: 4, fill: css("turn") }));
  if (hint) svg.append(s("rect", { x: px(0) - 20, y: y - 9, width: 8, height: 18, rx: 2, fill: css("hint") }));
  T(svg, 0, y + 4, label, { fill: color });
  const edge = (x1, y1, x2, y2, p) => svg.append(s("path", {
    d: `M${x1},${y1} C${x1 + dx * .5},${y1} ${x2 - dx * .5},${y2} ${x2},${y2}`,
    stroke: color, "stroke-width": W(p), fill: "none", "stroke-linecap": "round" }));
  NEXT.forEach((cands, i) => {
    // the branch into the rollout's token
    edge(px(i), y, px(i + 1), y, cands[0][side]);
    // the other branches, only where they carry real weight; at the key token they grow a step further
    let k = 0;
    for (const c of cands.slice(1)) {
      if (Math.max(c[1], c[2]) < 0.12) continue;
      k++;
      const by = y - k * 19;
      edge(px(i), y, px(i + 1), by, c[side]);
      T(svg, px(i + 1) + 5, by + 4, c[0].trim(), { "font-size": 10 });
      if (i === KEY && c[0] === " submit") {  // the tree keeps growing past the token it would submit with
        const lx = px(i + 1) + 5 + c[0].trim().length * 6.2 + 6;
        edge(lx, by, lx + 30, by, c[side] * .95);
        T(svg, lx + 35, by + 4, "task_complete", { "font-size": 10 });
      }
    }
  });
  TOKENS.forEach((t, i) => {
    svg.append(s("circle", { cx: px(i + 1), cy: y, r: 2.5, fill: css("ink") }));
    T(svg, px(i + 1), y + 22, t.trim(), { "text-anchor": "middle", fill: css("ink"), "font-size": 10.5 });
  });
}

heading("Version B: two trees");

frame("4B", "Each model's tree of what could come next, drawn the same way for both. The gray band is the fixed rollout. The student's weight stays on the rollout's path; at “also” the teacher's moves to submit and wrap.", 600, 230, svg => {
  tree(svg, 75, 1, css("student"), "student", false);
  tree(svg, 190, 2, css("teacher"), "teacher", true);
});

frame("6B", "After training, the student's tree has the teacher's shape.", 600, 230, svg => {
  tree(svg, 75, 2, css("student"), "student", false);
  tree(svg, 190, 2, css("teacher"), "teacher", true);
});

heading("Then");

frame(7, "The payoff: the trained model, given no hint, wraps up and submits sooner.", 600, 100, svg => {
  row(svg, 8);
  T(svg, 0, 28, "before");
  row(svg, 58, { end: 10, submitLast: true });
  T(svg, 0, 78, "after training");
});
</script>
</body>
</html>
