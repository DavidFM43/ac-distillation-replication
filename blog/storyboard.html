<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure storyboard</title>
<style>
:root {
  --bg: #fcfcfb; --ink: #1a1a19; --muted: #6b6a66; --faint: #b4b3ae; --line: #e6e5e1;
  --turn: #d6d5d0; --task: #3b3b38; --student: #3d7fd6; --teacher: #e09a2f; --hint: #e09a2f;
  --bad: #e0574c; --good: #5fae78;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --faint: #5a5955; --line: #34342f; --turn: #4a4a46; --task: #c9c8c3; }
}
:root[data-theme="dark"] { --bg: #1b1b1a; --ink: #ecebe8; --muted: #a09f9a; --faint: #5a5955; --line: #34342f; --turn: #4a4a46; --task: #c9c8c3; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
main { max-width: 680px; margin: 32px auto; padding: 0 16px; }
h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
.note { font-size: 13px; color: var(--muted); margin: 0 0 28px; }
.frame { border-top: 1px solid var(--line); padding: 16px 0 26px; }
.cap { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.cap b { color: var(--ink); font-weight: 600; margin-right: 6px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
svg text { font-family: var(--mono); }
</style>
</head>
<body>
<main>
  <h1>Headline figure: storyboard</h1>
  <p class="note">Static frames, before any animation. The captions are notes for us, not part of the figure.</p>
  <div id="frames"></div>
</main>
<script>
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs = {}, text) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
};
const css = v => `var(--${v})`;

function frame(n, caption, w, h, draw) {
  const f = document.createElement("div");
  f.className = "frame";
  f.innerHTML = `<div class="cap"><b>${n}</b>${caption}</div>`;
  const svg = s("svg", { viewBox: `0 0 ${w} ${h}` });
  draw(svg);
  f.append(svg);
  document.getElementById("frames").append(f);
}

// ---- Frames 1–3: the rollout as a row of turn blocks ----

// Which turns the row shows; a gap stands for the turns in between
const SHOWN = ["task", 1, 2, 3, 4, 5, "gap", 36, 37, 38, 39, 40, "gap", 72, 73];
const BW = 26, BH = 34, GAP = 5, GAPW = 22;

function row(svg, y, { hint = false, label, color } = {}) {
  let x = 70;
  if (label) {
    svg.append(s("circle", { cx: 8, cy: y + BH / 2, r: 4, fill: css(color) }));
    svg.append(s("text", { x: 18, y: y + BH / 2 + 4, "font-size": 11, fill: css("muted") }, label));
  }
  const xs = {};
  for (const t of SHOWN) {
    if (t === 38 && hint) {
      svg.append(s("rect", { x, y, width: BW, height: BH, rx: 4, fill: css("hint") }));
      xs.hint = x;
      x += BW + GAP;
    }
    if (t === "gap") {
      for (let i = 0; i < 3; i++) svg.append(s("circle", { cx: x + 5 + i * 6, cy: y + BH / 2, r: 1.6, fill: css("faint") }));
      x += GAPW;
      continue;
    }
    svg.append(s("rect", { x, y, width: BW, height: BH, rx: 4, fill: t === "task" ? css("task") : css("turn") }));
    xs[t] = x;
    x += BW + GAP;
  }
  return xs;
}

function turnLabels(svg, xs, y, turns) {
  for (const t of turns) svg.append(s("text", { x: xs[t] + BW / 2, y, "font-size": 9.5, fill: css("muted"), "text-anchor": "middle" }, t));
}

frame(1, "The model's rollout: a finished sequence of turns. Fixed data from here on.", 600, 70, svg => {
  const xs = row(svg, 10);
  turnLabels(svg, xs, 60, [1, 37, 38, 73]);
});

frame(2, "The same model reads that sequence twice: as the student and as the teacher.", 600, 120, svg => {
  row(svg, 10, { label: "student", color: "student" });
  const xs = row(svg, 62, { label: "teacher", color: "teacher" });
  turnLabels(svg, xs, 112, [1, 37, 38, 73]);
});

frame(3, "The only difference: the teacher's copy gets a hint before turn 38. Everything after it is the same tokens, shifted over.", 600, 150, svg => {
  const a = row(svg, 10, { label: "student", color: "student" });
  const b = row(svg, 62, { label: "teacher", color: "teacher", hint: true });
  // Same turn, same tokens: connect each turn after the hint across the two rows
  for (const t of [38, 39, 40]) {
    svg.append(s("path", { d: `M${a[t] + BW / 2},${10 + BH} L${b[t] + BW / 2},62`, stroke: css("faint"), "stroke-dasharray": "2 3", fill: "none" }));
  }
  svg.append(s("text", { x: b.hint + BW / 2, y: 112, "font-size": 9.5, fill: css("teacher"), "text-anchor": "middle" }, "hint"));
  svg.append(s("text", { x: b.hint + BW / 2, y: 132, "font-size": 10.5, fill: css("muted"), "text-anchor": "middle" },
    "“…close to your 40-turn limit. Wrap up and call task_complete.”"));
});

// ---- Frames 4–6: turn 38 as a trunk of tokens, with each model's next-token tree ----

// The stored tokens of turn 38 and, after each one, what each model would put next:
// [next token, p student (no hint), p teacher (with hint)]; the stored next token is first
const TOKENS = ["Let", " me", " also", " run", " the", " tests", "."];
const NEXT = [
  [["Let", .80, .62], ["I", .13, .18], ["All", .04, .15]],
  [[" me", .99, .99]],
  [[" also", .48, .07], [" run", .30, .09], [" submit", .02, .42], [" wrap", .03, .36]],
  [[" run", .62, .55], [" check", .25, .30]],
  [[" the", .86, .80], [" all", .10, .13]],
  [[" tests", .97, .96]],
  [[".", .62, .38], [" and", .05, .32]],
];

const LANE = p => 1 + p * 7;  // lane width for a probability

// The trunk: the stored tokens, and between them one lane per model, as wide as that model's
// probability of the stored next token. On the left, each model's context: the teacher's ends in the hint.
function trunk(svg, y, colorFor, sideFor) {
  svg.append(s("rect", { x: 0, y: y - 20, width: 46, height: 17, rx: 3, fill: css("turn") }));
  svg.append(s("rect", { x: 0, y: y + 3, width: 46, height: 17, rx: 3, fill: css("turn") }));
  svg.append(s("rect", { x: 38, y: y + 3, width: 8, height: 17, rx: 2, fill: css("hint") }));
  let x = 74;
  const cells = [];
  for (const [i, t] of TOKENS.entries()) {
    const w = t.trim().length * 7.6 + 16;
    const x0 = i ? cells[i - 1].x + cells[i - 1].w : 46;
    for (const [dir, j, color] of [[-1, sideFor(i, 1), "student"], [1, 2, "teacher"]]) {
      const lw = LANE(NEXT[i][0][j]);
      svg.append(s("line", { x1: x0, x2: x, y1: y + dir * (lw / 2 + 1), y2: y + dir * (lw / 2 + 1), stroke: css(color), "stroke-width": lw }));
    }
    svg.append(s("rect", { x, y: y - 12, width: w, height: 24, rx: 4, fill: colorFor ? colorFor(i) : css("turn") }));
    svg.append(s("text", { x: x + w / 2, y: y + 4, "font-size": 12, "text-anchor": "middle", fill: css("ink") }, t.trim()));
    cells.push({ x, w, i, x0 });
    x += w + 40;
  }
  return cells;
}

// The other next tokens each model considers before this token, branching off the trunk
function branches(svg, cell, y, dir, j, color) {
  let k = 0;
  for (const c of NEXT[cell.i].slice(1)) {
    const p = c[j];
    if (p < 0.04) continue;
    const rx = cell.x0 + 6, ry = y + dir * 3;
    const ex = rx + 16 + k * 5, ey = y + dir * (28 + k * 17);
    svg.append(s("path", { d: `M${rx},${ry} C${rx + 2},${ry + dir * 12} ${ex - 10},${ey} ${ex},${ey}`,
      stroke: css(color), "stroke-width": LANE(p), fill: "none", "stroke-linecap": "round" }));
    svg.append(s("text", { x: ex + 5, y: ey + 4, "font-size": 10.5, fill: css("muted") }, c[0].trim()));
    k++;
  }
}

function trees(svg, y, { trained = false, colorFor } = {}) {
  // After training, the student's tree takes the teacher's shape
  const studentSide = () => trained ? 2 : 1;
  const cells = trunk(svg, y, colorFor, studentSide);
  svg.append(s("text", { x: 0, y: y - 28, "font-size": 11, fill: css("student") }, "student"));
  svg.append(s("text", { x: 0, y: y + 36, "font-size": 11, fill: css("teacher") }, "teacher"));
  for (const cell of cells) {
    branches(svg, cell, y, -1, studentSide(), "student");
    branches(svg, cell, y, 1, 2, "teacher");
  }
  return cells;
}

frame(4, "Zoom into turn 38. The stored tokens are a shared trunk. Above it, the student's next-token tree (no hint); below it, the teacher's (with hint). Thickness is probability. They agree almost everywhere, except before “also”: the teacher would rather submit or wrap up.", 600, 200, svg => {
  trees(svg, 95);
});

// KL(teacher ‖ student) over the candidates and the rest of the vocabulary
function kl(cands) {
  const rest = j => Math.max(1 - cands.reduce((t, c) => t + c[j], 0), 1e-3);
  return cands.map(c => [c[1], c[2]]).concat([[rest(1), rest(2)]]).reduce((t, [a, b]) => t + b * Math.log(b / a), 0);
}
const mix = (k, alpha) => {
  const x = Math.min(Math.max(k, 0) / 1.5, 1), g = [95, 174, 120], r = [224, 87, 76];
  return `rgb(${g.map((v, i) => Math.round(v + (r[i] - v) * x)).join(" ")} / ${alpha})`;
};

frame(5, "Score each token by how different the two trees are there (KL). Green: the hint changes nothing. Red: the hint changes what comes next.", 600, 200, svg => {
  trees(svg, 95, { colorFor: i => mix(kl(NEXT[i]), .55) });
});

frame(6, "Training pulls the student's tree toward the teacher's. The student now leans toward wrapping up, without ever seeing the hint.", 600, 200, svg => {
  trees(svg, 95, { trained: true, colorFor: () => mix(0, .55) });
});
</script>
</body>
</html>
