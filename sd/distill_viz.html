<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distillation Examples</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
    --code: #f1f1ed; --accent: #2f6fdb; --hint: #b7791f; --hint-bg: #fdf3e1;
    --target: #2e8b57; --target-bg: #e8f5ee; --pass: #2e8b57; --fail: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --panel: #1f1f1d; --text: #ecece7; --muted: #9d9d96; --line: #33332f;
      --code: #191918; --accent: #6b9bf0; --hint: #d9a441; --hint-bg: #2b2415;
      --target: #5cbf86; --target-bg: #17281f; --pass: #5cbf86; --fail: #e0685b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  @media (max-width: 800px) { .app { grid-template-columns: 1fr; height: auto; } .list { max-height: 45vh; } }
  .side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .side h1 { font-size: 16px; margin: 14px 14px 4px; }
  .side .meta { color: var(--muted); font-size: 12px; margin: 0 14px 10px; }
  .filters { display: grid; gap: 6px; padding: 0 14px 10px; border-bottom: 1px solid var(--line); }
  .filters input, .filters select { width: 100%; padding: 5px 8px; font: inherit; font-size: 13px;
      background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
  .filters .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .list { overflow-y: auto; flex: 1; min-height: 0; }
  .item { padding: 8px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--bg); }
  .item.sel { background: var(--target-bg); }
  .item .id { font-weight: 600; font-size: 13px; word-break: break-all; }
  .item .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .main { overflow-y: auto; min-height: 0; padding: 18px 20px 60px; }
  .empty { color: var(--muted); margin-top: 40px; text-align: center; }
  .head h2 { margin: 0 0 6px; font-size: 18px; word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1px 9px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip.pass { color: var(--pass); border-color: var(--pass); } .chip.fail { color: var(--fail); border-color: var(--fail); }
  .toolbar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
      padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
  details > summary { cursor: pointer; padding: 7px 12px; list-style: none; display: flex; gap: 10px; align-items: baseline; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸"; color: var(--muted); width: 10px; flex: none; }
  details[open] > summary::before { content: "▾"; }
  .sum-title { font-weight: 600; white-space: nowrap; }
  .sum-cmd { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .sum-stats { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .body { padding: 0 12px 10px 32px; }
  .body details { margin: 6px 0; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 8px 0 3px; }
  pre { margin: 0; padding: 8px 10px; background: var(--code); border-radius: 6px; white-space: pre-wrap;
        word-break: break-word; font: 12px/1.45 ui-monospace, Menlo, monospace; max-height: 420px; overflow: auto; }
  .prose { white-space: pre-wrap; word-break: break-word; }
  .after > summary, .after .body { opacity: .6; }
  .hint { border: 1px solid var(--hint); background: var(--hint-bg); border-radius: 8px; padding: 9px 12px; margin-bottom: 8px; }
  .hint .label { color: var(--hint); margin-top: 0; }
  .target { border: 2px solid var(--target); }
  .target > summary .sum-title { color: var(--target); }
  .section { color: var(--muted); font-size: 12px; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>Distillation Examples</h1>
    <div class="meta" id="count">loading…</div>
    <div class="filters">
      <input id="q" placeholder="Search task (e.g. django-11)">
      <div class="row">
        <select id="turn"><option value="">Any hint turn</option></select>
        <select id="outcome">
          <option value="">Any outcome</option>
          <option value="late">Submitted later</option>
          <option value="never">Never submitted</option>
          <option value="pass">Tests pass</option>
          <option value="fail">Tests fail</option>
        </select>
      </div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="main" id="main"><div class="empty">Pick an example on the left. Use j / k to move between examples.</div></main>
</div>
<script>
let index = [], shown = [], current = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const k = n => n == null ? "–" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
const outcomeText = o => (o.submitted ? `submitted t${o.submit_turn}` : `never submitted (${o.stop_reason})`);

function renderList() {
  const q = $("q").value.trim().toLowerCase(), t = $("turn").value, o = $("outcome").value;
  shown = index.filter(e => (!q || e.instance_id.toLowerCase().includes(q)) && (!t || e.hint_turn == t) &&
    (!o || (o === "late" && e.submitted) || (o === "never" && !e.submitted) || (o === "pass" && e.tests_passed) || (o === "fail" && !e.tests_passed)));
  $("count").textContent = `${shown.length} of ${index.length} examples`;
  $("list").innerHTML = shown.map(e => `<div class="item ${e.instance_id === current ? "sel" : ""}" data-id="${esc(e.instance_id)}">
    <div class="id">${esc(e.instance_id)}</div>
    <div class="sub">hint t${e.hint_turn}${e.n_supervised > 1 ? ` · ${e.n_supervised} turns` : ""} · target ${e.target_len} tok · ctx ${k(e.context_len)} · ${esc(outcomeText(e))} · ${e.tests_passed ? "pass" : "fail"}</div></div>`).join("");
}

function turnBlock(t, kind, openAll) {
  const firstLine = s => (s.split("\n").find(l => l.trim()) || "").trim();
  const cmd = t.tool_calls.length
    ? t.tool_calls.map(c => c.name === "bash" ? firstLine(c.command) : c.name).join("  ·  ")
    : "(no tool call)";
  const title = kind === "target" ? `Turn ${t.turn} · TARGET (trained)` : `Turn ${t.turn}`;
  const open = kind === "target" || openAll ? "open" : "";
  const inner = [
    t.thinking ? `<details ${kind === "target" ? "open" : ""}><summary><span class="sum-title">Thinking</span><span class="sum-stats">${t.thinking.length.toLocaleString()} chars</span></summary><div class="body"><pre>${esc(t.thinking)}</pre></div></details>` : "",
    t.text ? `<div class="label">Text</div><div class="prose">${esc(t.text)}</div>` : "",
    ...t.tool_calls.map(c => `<div class="label">Tool call: ${esc(c.name)}</div>${c.command ? `<pre>${esc(c.command)}</pre>` : ""}`),
    ...t.results.map((r, i) => `<details><summary><span class="sum-title">${r.role === "tool" ? "Output" : "Message (" + esc(r.role) + ")"}${t.results.length > 1 ? " " + (i + 1) : ""}</span><span class="sum-stats">${r.content.length.toLocaleString()} chars</span></summary><div class="body"><pre>${esc(r.content)}</pre></div></details>`),
  ].join("");
  return `<details class="turn ${kind}" ${open}><summary><span class="sum-title">${title}</span><span class="sum-cmd">${esc(cmd)}</span>
    <span class="sum-stats">ctx ${k(t.context_len)} · out ${t.output_len} tok</span></summary><div class="body">${inner}</div></details>`;
}

async function show(id) {
  current = id; renderList();
  const sel = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`); if (sel) sel.scrollIntoView({ block: "nearest" });
  $("main").innerHTML = `<div class="empty">loading ${esc(id)}…</div>`;
  const d = await (await fetch("/example/" + encodeURIComponent(id))).json();
  if (current !== id) return;
  const o = d.outcome, h = d.hint_turn, end = h + d.n_supervised;  // supervised turns: h..end-1
  const before = d.turns.filter(t => t.turn < h), targets = d.turns.filter(t => t.turn >= h && t.turn < end),
    after = d.turns.filter(t => t.turn >= end);
  $("main").innerHTML = `
    <div class="head"><h2>${esc(d.instance_id)}</h2>
      <div class="chips"><span class="chip">hint before turn ${h}</span><span class="chip">${d.n_supervised > 1 ? `trained turns ${h}–${end - 1} · ` : ""}target ${d.target_len} tokens</span>
        <span class="chip">teacher +${d.teacher_extra} tokens</span><span class="chip">${o.n_turns} turns total</span>
        <span class="chip">${esc(outcomeText(o))}</span><span class="chip ${o.tests_passed ? "pass" : "fail"}">tests ${o.tests_passed ? "pass" : "fail"}</span></div></div>
    <div class="toolbar"><button data-act="expand">Expand all</button><button data-act="collapse">Collapse all</button>
      <button data-act="context">Toggle context turns</button><button data-act="target">Jump to target</button></div>
    ${d.preamble.map(p => `<details><summary><span class="sum-title">${p.role === "system" ? "System prompt" : "Task (" + esc(p.role) + ")"}</span><span class="sum-stats">${p.content.length.toLocaleString()} chars</span></summary><div class="body"><pre>${esc(p.content)}</pre></div></details>`).join("")}
    <div class="section">Context: turns 1–${h - 1} (the student and teacher both see these)</div>
    ${before.map(t => turnBlock(t, "context")).join("")}
    <div class="hint" id="hint"><div class="label">Hint · teacher only · user message inserted here</div><div class="prose">${esc(d.hint)}</div></div>
    ${targets.map(t => turnBlock(t, "target")).join("")}
    <div class="section">What the model did next (not trained)</div>
    ${after.map(t => turnBlock(t, "after")).join("")}`;
  $("main").scrollTop = 0;
}

document.addEventListener("click", e => {
  const item = e.target.closest(".item"); if (item) return show(item.dataset.id);
  const act = e.target.dataset.act; if (!act) return;
  const all = [...$("main").querySelectorAll("details")];
  if (act === "expand") all.forEach(d => d.open = true);
  if (act === "collapse") all.forEach(d => d.open = false);
  if (act === "context") { const ctx = [...$("main").querySelectorAll("details.context")]; const open = !ctx.some(d => d.open); ctx.forEach(d => d.open = open); }
  if (act === "target") { const t = $("main").querySelector(".turn.target"); if (t) { t.open = true; $("hint").scrollIntoView({ block: "start" }); } }
});
["q", "turn", "outcome"].forEach(id => $(id).addEventListener("input", renderList));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || !["j", "k"].includes(e.key) || !shown.length) return;
  const i = shown.findIndex(x => x.instance_id === current);
  const next = shown[Math.max(0, Math.min(shown.length - 1, (i < 0 ? -1 : i) + (e.key === "j" ? 1 : -1)))];
  if (next) show(next.instance_id);
});

(async () => {
  index = await (await fetch("/index.json")).json();
  index.sort((a, b) => a.instance_id.localeCompare(b.instance_id));
  [...new Set(index.map(e => e.hint_turn))].sort((a, b) => a - b)
    .forEach(t => $("turn").insertAdjacentHTML("beforeend", `<option value="${t}">Hint turn ${t}</option>`));
  renderList();
  if (index.length) show(index[0].instance_id);
})();
</script>
</body>
</html>
