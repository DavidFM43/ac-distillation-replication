[project]
name = "sd-swebench"
version = "0.1.0"
description = "Replicating Applied Compute's Qwen3.5 SWE-bench self-distillation result"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "modal>=1.5.5",
    "tinker-cookbook>=0.5.7",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
]
infra = [
    "pyyaml>=6.0",
    "skypilot[aws,runpod]>=0.13.0",
    "typer>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
